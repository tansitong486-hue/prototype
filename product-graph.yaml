flows:
  - id: flow.multi_condition_explore
    name: 多工况探索
    purpose: 主动补齐稀缺工况样本；默认范围可编辑、仅自动下发；兼容水冷一次/二次泵与风冷；列表→策略制定→执行详情→仿真校验式验证详情；验证不入库，可选回流机理重训
    steps:
      - page_id: page.multi_condition_list
      - page_id: page.multi_condition_strategy
      - page_id: page.multi_condition_detail
      - page_id: page.multi_condition_verify
      - page_id: page.mechanism_train  # 可选回流
    binds:
      - page.multi_condition_list
      - page.multi_condition_strategy
      - page.multi_condition_detail
      - page.multi_condition_verify
      - domain:multi_condition
      - page.system_sim           # 仿真实例绑定
      - page.safety_fallback      # 安全回退绑定
      - page.mechanism_train      # 验证后可选重训

  - id: flow.cold_station_opt_family
    name: 冷站寻优族
    purpose: 冷站仿真对比与柔性/全局/长周期寻优互跳；运行时绑定仿真模型、安全边界、智控下发、安全回退
    steps:
      - page_id: page.cold_sim_setup
      - page_id: page.cold_sim_result
      - page_id: page.cold_flex_opt
      - page_id: page.cold_global_opt
      - page_id: page.cold_long_cycle_opt
    binds:
      - domain:cold_station_opt
      - page.cold_sim_setup
      - page.cold_sim_result
      - page.cold_flex_opt
      - page.cold_global_opt
      - page.cold_long_cycle_opt
      - page.system_sim
      - page.safety_boundary_list
      - page.dispatch_list
      - page.safety_fallback

  - id: flow.energy_config_to_consume
    name: 能耗配置到消费分析
    purpose: 计量拓扑与表具明细配置完成后，供总览/流向/对比/定额/节能分析 on-read 消费；区分实施期自检与运行期 VEE
    steps:
      - page_id: page.efficiency_view
      - page_id: page.create_collection
      - page_id: page.energy_config
      - page_id: page.energy_edit
      - page_id: page.billing_plan
      - page_id: page.billing_plan_edit
      - page_id: page.meter_detail
      - page_id: page.data_quality_check
      - page_id: page.overview_dashboard
      - page_id: page.energy_flow
      - page_id: page.energy_compare
      - page_id: page.energy_quota
      - page_id: page.energy_saving
    binds:
      - domain:asset_model
      - domain:energy_metering
      - domain:data_quality
      - domain:energy_consume
      - domain:overview
      - page.efficiency_view
      - page.energy_config
      - page.meter_detail
      - page.data_quality_check
      - page.overview_dashboard
      - page.energy_flow
      - page.energy_compare
      - page.energy_quota
      - page.energy_saving

  - id: flow.model_train_sim
    name: 模型训练与仿真
    purpose: 机理模型训练（含创建/评估/手动训练 orphan）与系统仿真建模→创建→校验闭环
    steps:
      - page_id: page.mechanism_train
      - page_id: page.model_create_edit
      - page_id: page.manual_train
      - page_id: page.model_eval
      - page_id: page.system_sim
      - page_id: page.create_sim
      - page_id: page.sim_verify
    binds:
      - domain:sim_predict
      - page.mechanism_train
      - page.model_create_edit
      - page.manual_train
      - page.model_eval
      - page.system_sim
      - page.create_sim
      - page.sim_verify

  - id: flow.room_opt_diagnosis
    name: 机房寻优与诊断
    purpose: 机房总览进入柔性/加减机；健康度跳转智能诊断；热力模型创建影响诊断可用性
    steps:
      - page_id: page.room_overview
      - page_id: page.room_flex_opt
      - page_id: page.room_add_remove_opt
      - page_id: page.room_diagnosis
      - page_id: page.room_thermal_list
      - page_id: page.room_model_s1
      - page_id: page.room_model_s2
    binds:
      - domain:room_opt
      - domain:room_diagnosis
      - page.room_overview
      - page.room_flex_opt
      - page.room_add_remove_opt
      - page.room_diagnosis
      - page.room_thermal_list
      - page.room_model_s1
      - page.room_model_s2

  - id: flow.config_crud_safety_dispatch
    name: 安全与下发配置
    purpose: 安全边界、智控下发、安全回退策略 CRUD
    steps:
      - page_id: page.safety_boundary_list
      - page_id: page.safety_boundary_create
      - page_id: page.safety_boundary_edit
      - page_id: page.dispatch_list
      - page_id: page.dispatch_edit
      - page_id: page.safety_fallback
      - page_id: page.safety_fallback_edit
    binds:
      - domain:safety_dispatch
      - page.safety_boundary_list
      - page.safety_boundary_create
      - page.safety_boundary_edit
      - page.dispatch_list
      - page.dispatch_edit
      - page.safety_fallback
      - page.safety_fallback_edit

requirements:
  - id: req.v25.energy_metering
    version: v2.5
    status: 规划中
    domain: energy_metering
    prd_path: 04-需求文档/AI节能v2.5 版本/基于计费的能耗明细系统需求方案与架构.md
    prototype_pages:
      - 能耗管理-表具明细.html
      - 能源配置.html
      - 计费方案配置.html
      - 新增-编辑能源.html
      - 新增-编辑能源计费方案.html
      - 能效视图.html
      - 数据质量自检.html
    upstream: [req.v21.data_quality_selfcheck]
    downstream: [req.v25.energy_consume]
    algo_vs_ui: mixed
    notes: 需求1–6明细引擎；表具归档+VEE+计量拓扑+on-read；自检页仅跳转/分工说明

  - id: req.v25.energy_consume
    version: v2.5
    status: 规划中
    domain: energy_consume
    prd_path: 04-需求文档/AI节能v2.5 版本/存量页面消费与总览看板改造需求方案.md
    prototype_pages:
      - 总览看板.html
      - 能耗流向分析.html
      - 用能对比分析.html
      - 用能定额考核.html
      - 节能分析.html
    upstream: [req.v25.energy_metering]
    downstream: []
    algo_vs_ui: ui
    notes: 存量四页切对象聚合接口；总览含明细/导出，不另开统计分析页

  - id: req.v24.multi_condition
    version: v2.4
    status: 规划中
    domain: multi_condition
    prd_path: 04-需求文档/AI节能v2.4 版本/主动激励-多工况探索需求方案.md
    prototype_pages:
      - 多工况探索-列表.html
      - 多工况探索-策略制定.html
      - 多工况探索-执行详情.html
      - 多工况探索-验证详情.html
    upstream: [req.cross.safety_dispatch_base, req.v23.l0_l1_confidence]
    downstream: [req.v23.l0_l1_confidence]
    algo_vs_ui: mixed
    notes: 策略/执行/验证三阶段；不绑定安全边界或下发策略，仅自动下发；水冷最低温差独立配置；兼容二次泵/风冷；验证复用仿真校验结构且不展示置信度

  - id: req.v24.global_opt_round_result
    version: v2.4
    status: 规划中
    domain: cold_station_opt
    prd_path: 04-需求文档/AI节能v2.4 版本/冷站全局寻优-本轮搜索结果展示需求方案.md
    prototype_pages:
      - 冷站全局寻优.html
    upstream: [req.v23.l0_l1_confidence, req.cross.safety_dispatch_base]
    downstream: []
    algo_vs_ui: ui
    notes: 本页增强不另开页；候选组合功率/COP+不合规原因码

  - id: req.v23.l0_l1_confidence
    version: v2.3
    status: 开发中
    domain: sim_predict
    prd_path: 04-需求文档/AI节能v2.3 版本/01-需求方案/模型泛化性优化需求文档.md
    prototype_pages:
      - 机理模型训练.html
      - 创建-编辑模型.html
      - 模型评估详情.html
      - 手动训练.html
      - 系统仿真建模.html
      - 创建仿真模型.html
      - 仿真校验.html
      - 冷站柔性调优.html
      - 冷站全局寻优.html
      - 冷站长周期寻优.html
      - 节能仿真对比-设定.html
      - 节能仿真对比-对比.html
