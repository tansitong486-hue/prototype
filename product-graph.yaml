edges:
  # 计量 → 消费 → 总览
  - from: domain.energy_metering
    to: domain.energy_consume
    rel: produces
  - from: domain.energy_consume
    to: domain.overview
    rel: implements
  - from: page.meter_detail
    to: page.overview_dashboard
    rel: produces
  - from: page.efficiency_view
    to: domain.energy_metering
    rel: binds
  # 数据质量
  - from: domain.data_quality
    to: domain.energy_metering
    rel: enhances
  - from: domain.data_quality
    to: domain.sim_predict
    rel: enhances
  - from: page.data_quality_check
    to: page.meter_detail
    rel: consumes
  # 仿真 → 寻优 / 多工况
  - from: domain.sim_predict
    to: domain.cold_station_opt
    rel: produces
  - from: domain.sim_predict
    to: domain.multi_condition
    rel: enhances
  - from: domain.multi_condition
    to: domain.sim_predict
    rel: produces
  - from: page.multi_condition_verify
    to: page.mechanism_train
    rel: consumes
  # 安全下发绑定
  - from: domain.safety_dispatch
    to: domain.multi_condition
    rel: binds
  - from: domain.safety_dispatch
    to: domain.cold_station_opt
    rel: binds
  # 置信贯穿冷站
  - from: req.v23.l0_l1_confidence
    to: page.cold_flex_opt
    rel: implements
  - from: req.v23.l0_l1_confidence
    to: page.sim_verify
    rel: implements
  - from: req.v24.global_opt_round_result
    to: page.cold_global_opt
    rel: enhances
  # 机房
  - from: domain.room_opt
    to: domain.room_diagnosis
    rel: reuses
  - from: domain.room_diagnosis
    to: page.room_overview
    rel: enhances
  # v2.6
  - from: req.v26.pac_power_predict
    to: domain.sim_predict
    rel: reuses
  - from: req.v26.pac_power_predict
    to: domain.room_opt
    rel: enhances

