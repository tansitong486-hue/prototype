<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创建/编辑安全回退策略</title>
  <style>
    :root {
      --primary: #1E40AF;
      --primary-dark: #17358A;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-hint: #94A3B8;
      --border: #D8E1EB;
      --border-light: #EAF0F6;
      --bg-body: #F6F8FB;
      --bg-card: #FFFFFF;
      --danger: #DC2626;
      --success: #16A34A;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --transition: .22s cubic-bezier(.4, 0, .2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-body);
      -webkit-font-smoothing: antialiased;
    }

    button { border: none; background: none; font: inherit; }
    a { color: inherit; text-decoration: none; }

    .layout { display: flex; flex-direction: column; min-height: 100vh; }
    .body-wrap { display: flex; flex: 1; min-height: 0; }
    .main { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg-body); }

    .breadcrumb {
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text-secondary);
      background: var(--bg-body);
    }
    .breadcrumb a { color: var(--text-secondary); cursor: pointer; }
    .breadcrumb a:hover { color: var(--primary); }
    .breadcrumb .sep { margin: 0 6px; color: var(--text-hint); }
    .breadcrumb .current { color: var(--text-primary); }

    .content-body {
      padding: 0 16px 76px;
    }

    .form-card {
      min-height: calc(100vh - 150px);
      padding: 22px 18px 28px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      box-shadow: var(--shadow-sm);
    }

    .page-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      color: var(--text-primary);
      cursor: pointer;
    }
    .page-back:hover { color: var(--primary); }
    .page-back .arrow { font-size: 18px; }
    .page-back .title {
      font-size: 18px;
      font-weight: 700;
    }

    .form-body {
      max-width: 820px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .section-title {
      margin: 8px 0 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-light);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .required { color: var(--danger); margin-left: 2px; }

    .input-wrap {
      position: relative;
      max-width: 808px;
    }

    .field-control {
      width: 100%;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      outline: none;
      background: #fff;
      font-size: 13px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .field-control:focus-visible {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.12);
    }
    .field-control::placeholder { color: var(--text-hint); }
    .field-control:disabled,
    .field-control[readonly],
    select:disabled,
    input:disabled {
      background: #F8FAFC;
      color: var(--text-hint);
      cursor: not-allowed;
    }

    .char-count {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: var(--text-secondary);
    }
    .input-wrap .field-control { padding-right: 60px; }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      min-height: 34px;
    }

    .checkbox-group label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-primary);
    }

    input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #1E88E5;
    }

    .space-picker {
      max-width: 808px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }

    .space-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 32px;
      margin-bottom: 10px;
    }

    .space-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: #EEF4FF;
      border: 1px solid #C7D7FE;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
    }
    .space-chip .chip-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    .space-chip .chip-remove:hover {
      color: var(--danger);
      background: rgba(220, 38, 38, 0.08);
    }

    .space-empty {
      font-size: 12px;
      color: var(--text-hint);
      line-height: 28px;
    }

    .space-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border-light);
    }

    .space-option {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      border: 1px dashed var(--border);
      border-radius: 999px;
      background: #F8FAFC;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .space-option:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #EEF4FF;
    }
    .space-option.selected {
      border-style: solid;
      border-color: #C7D7FE;
      background: #EEF4FF;
      color: var(--primary);
      font-weight: 600;
      cursor: default;
      opacity: 0.55;
    }
    .space-option:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .sub-label {
      display: block;
      margin: 14px 0 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .text-link {
      color: #1890FF;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .text-link:hover { opacity: .75; }
    .text-link.danger { color: var(--danger); }

    .point-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .point-head .sub-label {
      margin: 0;
    }

    .table-wrap {
      max-width: 808px;
      overflow-x: auto;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }
    .data-table thead th {
      padding: 10px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-light);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      background: #FBFCFE;
      white-space: nowrap;
    }
    .data-table tbody td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
      vertical-align: middle;
      white-space: nowrap;
    }
    .data-table tbody tr:last-child td { border-bottom: none; }

    .table-select,
    .table-input {
      width: 100%;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 8px;
      font-size: 12px;
      color: var(--text-primary);
      background: #fff;
      outline: none;
    }
    .table-select:disabled,
    .table-input:disabled {
      background: #F8FAFC;
      color: var(--text-hint);
      cursor: not-allowed;
    }

    .empty-row td {
      height: 56px;
      text-align: center;
      color: var(--text-hint);
    }

    .switch-row {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 808px;
      min-height: 34px;
    }
    .switch-label {
      font-size: 13px;
      font-weight: 700;
      min-width: 110px;
    }
    .switch-yes {
      font-size: 13px;
      color: var(--text-primary);
      min-width: 20px;
    }
    .switch-yes.is-off {
      visibility: hidden;
    }

    .switch {
      position: relative;
      display: inline-flex;
      width: 42px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      border-radius: 999px;
      background: #CBD5E1;
      transition: all var(--transition);
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.24);
      transition: all var(--transition);
    }
    .switch input:checked + .slider { background: #1E88E5; }
    .switch input:checked + .slider::before { transform: translateX(20px); }
    .switch input:disabled + .slider {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .action-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid var(--border-light);
      z-index: 220;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      height: 36px;
      padding: 0 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      color: #fff;
      background: var(--primary);
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-ghost {
      color: var(--primary);
      background: #fff;
      border: 1px solid var(--primary);
    }
    .btn-ghost:hover:not(:disabled) { background: #EEF4FF; }
    .btn-sm {
      min-width: auto;
      height: 30px;
      padding: 0 12px;
      font-size: 12px;
    }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 78px;
      min-width: 180px;
      max-width: 320px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      font-size: 12px;
      line-height: 1.6;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.28);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: all .25s ease;
      z-index: 260;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      .content-body { padding: 0 12px 84px; }
      .form-card { padding: 18px 14px 24px; }
      .data-table { min-width: 640px; }
      .point-head { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div id="app-header"></div>
    <div class="body-wrap">
      <div id="app-sidebar"></div>
      <main class="main">
        <div class="breadcrumb">
          <a href="安全回退策略.html">安全回退策略</a>
          <span class="sep">/</span>
          <span class="current" id="breadcrumbCurrent">新增安全回退策略</span>
        </div>

        <div class="content-body">
          <section class="form-card">
            <div class="page-back" id="backBtn">
              <span class="arrow">←</span>
              <span class="title" id="pageTitle">新增安全回退策略</span>
            </div>

            <div class="form-body">
              <!-- 1. 基本信息 -->
              <div class="form-group">
                <label class="field-label">回退策略名称<span class="required">*</span></label>
                <div class="input-wrap">
                  <input class="field-control" id="strategyName" type="text" maxlength="30" placeholder="请输入">
                  <span class="char-count" id="nameCount">0 / 30</span>
                </div>
              </div>

              <!-- 2. 报警触发规则配置 -->
              <h3 class="section-title">报警触发规则配置</h3>

              <div class="form-group">
                <label class="field-label">空间范围<span class="required">*</span></label>
                <div class="space-picker" id="spacePicker">
                  <div class="space-chips" id="spaceChips">
                    <span class="space-empty" id="spaceEmpty">请选择空间范围</span>
                  </div>
                  <div class="space-options" id="spaceOptions"></div>
                </div>
              </div>

              <div class="form-group">
                <label class="field-label">告警等级<span class="required">*</span></label>
                <div class="checkbox-group" id="alarmLevels">
                  <label><input type="checkbox" name="alarmLevel" value="紧急">紧急</label>
                  <label><input type="checkbox" name="alarmLevel" value="严重">严重</label>
                  <label><input type="checkbox" name="alarmLevel" value="重要">重要</label>
                  <label><input type="checkbox" name="alarmLevel" value="次要">次要</label>
                  <label><input type="checkbox" name="alarmLevel" value="预警">预警</label>
                  <label><input type="checkbox" name="alarmLevel" value="扩展一">扩展一</label>
                  <label><input type="checkbox" name="alarmLevel" value="扩展二">扩展二</label>
                  <label><input type="checkbox" name="alarmLevel" value="扩展三">扩展三</label>
                  <label><input type="checkbox" name="alarmLevel" value="扩展四">扩展四</label>
                  <label><input type="checkbox" name="alarmLevel" value="扩展五">扩展五</label>
                </div>
              </div>

              <!-- 3. 安全回退规则配置 -->
              <h3 class="section-title">安全回退规则配置</h3>

              <div class="form-group">
                <div class="switch-row">
                  <span class="switch-label">停止寻优/探索任务</span>
                  <label class="switch">
                    <input type="checkbox" id="stopOptimizeSwitch" checked>
                    <span class="slider"></span>
                  </label>
                  <span class="switch-yes" id="stopOptimizeYes">是</span>
                </div>
              </div>

              <div class="form-group">
                <div class="switch-row">
                  <span class="switch-label">启动工单通知</span>
                  <label class="switch">
                    <input type="checkbox" id="ticketNotifySwitch" checked>
                    <span class="slider"></span>
                  </label>
                  <span class="switch-yes" id="ticketNotifyYes">是</span>
                </div>
              </div>

              <div class="form-group">
                <div class="point-head">
                  <span class="sub-label">回退至安全值</span>
                  <button class="btn btn-primary btn-sm" id="addPointBtn" type="button">新增下发点位</button>
                </div>
                <div class="table-wrap">
                  <table class="data-table">
                    <thead>
                      <tr>
                        <th style="width: 28%;">物模型</th>
                        <th style="width: 28%;">下发测点</th>
                        <th style="width: 28%;">安全值</th>
                        <th style="width: 16%;">操作</th>
                      </tr>
                    </thead>
                    <tbody id="pointTbody">
                      <tr class="empty-row" id="pointEmpty"><td colspan="4">暂无下发点位</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn btn-ghost" id="cancelBtn" type="button">取消</button>
    <button class="btn btn-primary" id="saveBtn" type="button">保存</button>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var pageMode = params.get('mode') || 'create';
      var strategyName = params.get('name') || '';
      var toast = document.getElementById('toast');
      var toastTimer = null;
      var isView = pageMode === 'view';

      var SPACE_OPTIONS = [
        'A路01#制冷单元',
        'A路02#制冷单元',
        'A路03#制冷单元',
        'A路04#制冷单元',
        'A路05#制冷单元',
        'A路06#制冷单元',
        '101空调-1',
        '101空调-2',
        '101空调-3',
        '101空调-4',
        '101空调-5'
      ];

      var MODEL_POINTS = {
        '水冷冷水机组': ['冷冻出水温度设定', '开机'],
        '冷冻水泵': ['频率设定', '开机'],
        '冷却水泵': ['频率设定', '开机'],
        '冷却塔': ['频率设定', '开机'],
        '精密空调': ['开机', '回风温度设定']
      };

      var MODEL_OPTIONS = Object.keys(MODEL_POINTS);
      var selectedSpaces = [];

      var DEMO_DATA = {
        '冷水主机回退策略': {
          name: '冷水主机回退策略',
          spaces: ['A路01#制冷单元', 'A路02#制冷单元', 'A路03#制冷单元', 'A路04#制冷单元', 'A路05#制冷单元'],
          alarms: ['紧急', '严重', '重要'],
          stopOptimize: true,
          ticketNotify: true,
          points: [
            { model: '水冷冷水机组', point: '冷冻出水温度设定', value: '12' }
          ]
        },
        '末端机房回退': {
          name: '末端机房回退',
          spaces: ['101空调-1', '101空调-2', '101空调-3', '101空调-4', '101空调-5'],
          alarms: ['紧急', '严重'],
          stopOptimize: true,
          ticketNotify: true,
          points: [
            { model: '精密空调', point: '开机', value: '开机' }
          ]
        },
        '水泵、冷水主机故障安全回退策略': {
          name: '水泵、冷水主机故障安全回退策略',
          spaces: ['A路01#制冷单元', 'A路02#制冷单元', 'A路03#制冷单元'],
          alarms: ['紧急', '严重', '重要'],
          stopOptimize: true,
          ticketNotify: true,
          points: [
            { model: '冷冻水泵', point: '频率设定', value: '45' },
            { model: '水冷冷水机组', point: '冷冻出水温度设定', value: '10' }
          ]
        }
      };

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
      }

      function goList() {
        window.location.assign(encodeURI('安全回退策略.html'));
      }

      function updateTitle() {
        var map = {
          create: '新增安全回退策略',
          edit: '编辑安全回退策略',
          view: '查看安全回退策略'
        };
        var title = map[pageMode] || map.create;
        document.getElementById('pageTitle').textContent = title;
        document.getElementById('breadcrumbCurrent').textContent = title;
        document.title = title;
      }

      function updateNameCount() {
        var value = document.getElementById('strategyName').value;
        document.getElementById('nameCount').textContent = value.length + ' / 30';
      }

      function updateSwitchYes(switchId, yesId) {
        var on = document.getElementById(switchId).checked;
        document.getElementById(yesId).classList.toggle('is-off', !on);
      }

      function renderSpaceChips() {
        var chipsEl = document.getElementById('spaceChips');
        var emptyEl = document.getElementById('spaceEmpty');
        chipsEl.querySelectorAll('.space-chip').forEach(function (el) { el.remove(); });

        if (!selectedSpaces.length) {
          if (emptyEl) emptyEl.classList.remove('hidden');
        } else {
          if (emptyEl) emptyEl.classList.add('hidden');
          selectedSpaces.forEach(function (name) {
            var chip = document.createElement('span');
            chip.className = 'space-chip';
            chip.appendChild(document.createTextNode(name));
            if (!isView) {
              var removeBtn = document.createElement('button');
              removeBtn.type = 'button';
              removeBtn.className = 'chip-remove';
              removeBtn.setAttribute('aria-label', '移除');
              removeBtn.textContent = '×';
              removeBtn.addEventListener('click', function () {
                selectedSpaces = selectedSpaces.filter(function (s) { return s !== name; });
                renderSpaceChips();
                renderSpaceOptions();
              });
              chip.appendChild(removeBtn);
            }
            chipsEl.appendChild(chip);
          });
        }
      }

      function renderSpaceOptions() {
        var optionsEl = document.getElementById('spaceOptions');
        optionsEl.innerHTML = '';
        SPACE_OPTIONS.forEach(function (name) {
          var selected = selectedSpaces.indexOf(name) !== -1;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'space-option' + (selected ? ' selected' : '');
          btn.textContent = name;
          btn.disabled = isView || selected;
          if (!isView && !selected) {
            btn.addEventListener('click', function () {
              selectedSpaces.push(name);
              renderSpaceChips();
              renderSpaceOptions();
            });
          }
          optionsEl.appendChild(btn);
        });
      }

      function setAlarmLevels(levels) {
        document.querySelectorAll('input[name="alarmLevel"]').forEach(function (cb) {
          cb.checked = levels.indexOf(cb.value) !== -1;
        });
      }

      function pointOptionsHtml(model, selectedPoint) {
        var points = MODEL_POINTS[model] || [];
        var html = '<option value="">请选择</option>';
        points.forEach(function (p) {
          html += '<option value="' + p + '"' + (p === selectedPoint ? ' selected' : '') + '>' + p + '</option>';
        });
        return html;
      }

      function modelOptionsHtml(selectedModel) {
        var html = '<option value="">请选择</option>';
        MODEL_OPTIONS.forEach(function (m) {
          html += '<option value="' + m + '"' + (m === selectedModel ? ' selected' : '') + '>' + m + '</option>';
        });
        return html;
      }

      function refreshEmptyRow() {
        var hasRows = !!document.querySelector('#pointTbody tr:not(.empty-row)');
        document.getElementById('pointEmpty').classList.toggle('hidden', hasRows);
      }

      function bindPointRow(tr) {
        var modelSelect = tr.querySelector('[data-model]');
        var pointSelect = tr.querySelector('[data-point]');
        var deleteBtn = tr.querySelector('[data-delete-row]');

        modelSelect.addEventListener('change', function () {
          pointSelect.innerHTML = pointOptionsHtml(modelSelect.value, '');
        });

        if (deleteBtn) {
          deleteBtn.addEventListener('click', function () {
            tr.remove();
            refreshEmptyRow();
          });
        }
      }

      function createPointRow(data) {
        data = data || { model: '', point: '', value: '' };
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td><select class="table-select" data-model>' + modelOptionsHtml(data.model) + '</select></td>' +
          '<td><select class="table-select" data-point>' + pointOptionsHtml(data.model, data.point) + '</select></td>' +
          '<td><input class="table-input" data-value type="text" placeholder="请输入" value="' + (data.value || '') + '"></td>' +
          '<td>' + (isView ? '—' : '<span class="text-link danger" data-delete-row>删除</span>') + '</td>';
        document.getElementById('pointTbody').appendChild(tr);
        if (!isView) bindPointRow(tr);
        if (isView) {
          tr.querySelectorAll('select, input').forEach(function (el) { el.disabled = true; });
        }
        refreshEmptyRow();
        return tr;
      }

      function clearPointRows() {
        document.querySelectorAll('#pointTbody tr:not(.empty-row)').forEach(function (tr) { tr.remove(); });
        refreshEmptyRow();
      }

      function applyDemoOrDefaults() {
        var demo = DEMO_DATA[strategyName];

        if (pageMode === 'create') {
          document.getElementById('strategyName').value = '';
          selectedSpaces = [];
          setAlarmLevels([]);
          document.getElementById('stopOptimizeSwitch').checked = true;
          document.getElementById('ticketNotifySwitch').checked = true;
          clearPointRows();
          createPointRow();
          return;
        }

        if (demo) {
          document.getElementById('strategyName').value = demo.name;
          selectedSpaces = demo.spaces.slice();
          setAlarmLevels(demo.alarms);
          document.getElementById('stopOptimizeSwitch').checked = demo.stopOptimize;
          document.getElementById('ticketNotifySwitch').checked = demo.ticketNotify;
          clearPointRows();
          demo.points.forEach(function (p) { createPointRow(p); });
        } else {
          document.getElementById('strategyName').value = strategyName;
          selectedSpaces = [];
          setAlarmLevels([]);
          document.getElementById('stopOptimizeSwitch').checked = true;
          document.getElementById('ticketNotifySwitch').checked = true;
          clearPointRows();
          createPointRow();
        }
      }

      function applyViewMode() {
        if (!isView) return;

        document.querySelectorAll('input, select, button').forEach(function (el) {
          if (el.id === 'cancelBtn' || el.id === 'backBtn') return;
          if (el.classList.contains('chip-remove')) return;
          el.disabled = true;
        });

        document.getElementById('addPointBtn').classList.add('hidden');
        document.getElementById('saveBtn').classList.add('hidden');
        document.getElementById('cancelBtn').textContent = '返回';
        document.getElementById('cancelBtn').disabled = false;
      }

      document.getElementById('strategyName').addEventListener('input', updateNameCount);

      document.getElementById('stopOptimizeSwitch').addEventListener('change', function () {
        updateSwitchYes('stopOptimizeSwitch', 'stopOptimizeYes');
      });
      document.getElementById('ticketNotifySwitch').addEventListener('change', function () {
        updateSwitchYes('ticketNotifySwitch', 'ticketNotifyYes');
      });

      document.getElementById('addPointBtn').addEventListener('click', function () {
        createPointRow();
      });

      document.getElementById('cancelBtn').addEventListener('click', goList);
      document.getElementById('backBtn').addEventListener('click', goList);

      document.getElementById('saveBtn').addEventListener('click', function () {
        var name = document.getElementById('strategyName').value.trim();
        if (!name) {
          showToast('请填写回退策略名称');
          document.getElementById('strategyName').focus();
          return;
        }
        showToast('已保存');
        setTimeout(goList, 900);
      });

      updateTitle();
      applyDemoOrDefaults();
      renderSpaceChips();
      renderSpaceOptions();
      updateNameCount();
      updateSwitchYes('stopOptimizeSwitch', 'stopOptimizeYes');
      updateSwitchYes('ticketNotifySwitch', 'ticketNotifyYes');
      applyViewMode();
    })();
  </script>
  <script src="components/nav.js" data-active-nav="AI智能能效" data-active-sidebar="安全回退策略"></script>
</body>
</html>
