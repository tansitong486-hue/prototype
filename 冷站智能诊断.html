<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冷站智能诊断</title>
  <style>
    :root {
      --primary: #1E40AF;
      --primary-dark: #17358A;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-hint: #94A3B8;
      --border: #D8E1EB;
      --border-light: #EAF0F6;
      --bg-body: #F6F8FB;
      --bg-card: #FFFFFF;
      --danger: #DC2626;
      --warning: #D97706;
      --success: #16A34A;
      --blue-link: #1890FF;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --transition: .22s cubic-bezier(.4, 0, .2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-body);
      -webkit-font-smoothing: antialiased;
    }

    button { border: none; background: none; font: inherit; cursor: pointer; }
    select, input { font: inherit; }

    .layout { display: flex; flex-direction: column; min-height: 100vh; }
    .body-wrap { display: flex; flex: 1; min-height: 0; }
    .main { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg-body); }
    .page-shell { padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 14px; }

    .chart-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .page-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 0;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .chart-box {
      height: 220px;
      padding: 8px 10px 12px;
    }

    .list-card .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px 10px;
    }

    .page-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
    }

    .tabs {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border-radius: 10px;
      background: #F1F5F9;
    }

    .tab-btn {
      height: 30px;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all var(--transition);
    }

    .tab-btn:hover { color: var(--primary); }
    .tab-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .page-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 0 18px 14px;
    }

    .filter-select {
      height: 34px;
      min-width: 180px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .filter-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.12);
    }

    .table-wrap { overflow-x: auto; }

    .data-table {
      width: 100%;
      min-width: 1480px;
      border-collapse: collapse;
    }

    .data-table thead th {
      padding: 12px 14px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .data-table tbody td {
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }

    .data-table tbody tr:hover { background: #FBFCFE; }
    .data-table tbody tr.is-hidden { display: none; }

    .cell-clamp {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-width: 280px;
      line-height: 1.55;
      white-space: normal;
      color: var(--text-secondary);
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-tag.normal {
      background: #ECFDF3;
      color: var(--success);
    }

    .status-tag.abnormal {
      background: #FEF2F2;
      color: var(--danger);
    }

    .status-tag.warning {
      background: #FFFBEB;
      color: var(--warning);
    }

    .action-link {
      font-size: 13px;
      color: var(--blue-link);
      white-space: nowrap;
    }

    .action-link:hover { opacity: 0.72; }

    .page-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
    }

    .pagination-total {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .pagination {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .page-item,
    .page-arrow {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }

    .page-item.active {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    .empty-state {
      display: none;
      padding: 48px 18px;
      text-align: center;
      color: var(--text-hint);
      font-size: 13px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 240;
      padding: 24px;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: min(860px, 100%);
      max-height: min(80vh, 720px);
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 24px 48px rgba(15, 23, 42, 0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
    }

    .modal-title { font-size: 16px; font-weight: 700; }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 20px;
      line-height: 1;
    }

    .modal-close:hover { background: #F1F5F9; color: var(--text-primary); }

    .modal-body {
      padding: 16px 20px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .date-field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .date-field input {
      border: none;
      outline: none;
      color: var(--text-primary);
      width: 132px;
    }

    .modal .data-table { min-width: 640px; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      min-width: 180px;
      max-width: 320px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      font-size: 12px;
      line-height: 1.6;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.28);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: all .25s ease;
      z-index: 260;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1100px) {
      .chart-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div id="app-header"></div>
    <div class="body-wrap">
      <div id="app-sidebar"></div>
      <main class="main">
        <div class="page-shell">
          <div class="chart-row">
            <section class="page-card">

              </div>

            </section>
          </div>

          <section class="page-card list-card">
            <div class="page-head">
              <div class="page-title">智能诊断</div>

                <button type="button" class="tab-btn" data-tab="pending" role="tab">待处理</button>
                <button type="button" class="tab-btn active" data-tab="all" role="tab">全部</button>
              </div>
            </div>

            <div class="page-toolbar">
              <select class="filter-select" id="objectTypeFilter" aria-label="对象类型">
                <option value="">请选择对象类型</option>
                <option value="冷却塔">冷却塔</option>
                <option value="冷水主机">冷水主机</option>
                <option value="冷却泵">冷却泵</option>
                <option value="冷冻泵">冷冻泵</option>
                <option value="并联冷却塔管路">并联冷却塔管路</option>
                <option value="水冷冷水系统">水冷冷水系统</option>
              </select>
              <select class="filter-select" id="diagnosisTypeFilter" aria-label="诊断类型">

                <option value="频繁启停诊断">频繁启停诊断</option>
                <option value="电机过载诊断">电机过载诊断</option>
                <option value="压缩机过载诊断">压缩机过载诊断</option>
                <option value="频率异常震荡诊断">频率异常震荡诊断</option>
                <option value="冷却水出塔温度异常震荡诊断">冷却水出塔温度异常震荡诊断</option>
                <option value="冷冻水供水温度异常震荡诊断">冷冻水供水温度异常震荡诊断</option>
                <option value="冷冻侧流量异常震荡诊断">冷冻侧流量异常震荡诊断</option>
              </select>
            </div>

            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>对象名称</th>
                    <th>对象类型</th>
                    <th>诊断类型</th>
                    <th>最新诊断指标</th>
                    <th>最新诊断值</th>
                    <th>最新诊断状态</th>
                    <th>诊断时间</th>
                    <th>问题影响</th>
                    <th>优化建议</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="diagnosisTbody"></tbody>
              </table>
            </div>
            <div class="empty-state" id="emptyState">当前筛选条件下暂无诊断记录</div>

            <div class="page-foot">
              <div class="pagination-total" id="totalText">共 0 条</div>
              <div class="pagination">
                <span class="page-arrow">‹</span>
                <span class="page-item active">1</span>
                <span class="page-item">2</span>
                <span class="page-arrow">›</span>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="historyModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-labelledby="historyTitle">
      <div class="modal-head">
        <div class="modal-title" id="historyTitle">历史诊断</div>
        <button type="button" class="modal-close" id="historyClose" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-toolbar">
          <label class="date-field">
            时间范围
            <input type="date" id="histStart" value="2026-05-25">
            <span>-</span>
            <input type="date" id="histEnd" value="2026-05-26">
          </label>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>诊断指标</th>
                <th>诊断值</th>
                <th>诊断状态</th>
                <th>诊断时间</th>
              </tr>
            </thead>
            <tbody id="historyTbody"></tbody>
          </table>
        </div>
        <div class="pagination-total" id="historyTotal">共 0 条</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

          time: '2026-05-26 17:00:00',
          impact: '设备层面：风机电机烧毁、叶轮损坏；系统层面：冷却水温度升高、主机 COP 下降；安全层面：电机过载发热。',
          suggestion: '1. 降低变频频率或关闭部分风机；2. 检修风机并清理堵塞；3. 检查供电系统。'
        },
        {
          name: 'A路04#制冷单元', objectType: '冷水主机', diagnosisType: '压缩机过载诊断',
          indicator: '最大负载率', value: '48.20', status: '正常', pending: false,
          time: '2026-05-26 17:00:00',
          impact: '设备层面：电机绕组过热风险；系统层面：主机突发停机影响供冷；安全层面：电气线路发热。',
          suggestion: '1. 降低主机负载；2. 检查供电电压稳定性；3. 检修轴承与绕组。'
        }
      ];

      var tbody = document.getElementById('diagnosisTbody');
      var emptyState = document.getElementById('emptyState');
      var totalText = document.getElementById('totalText');
      var objectTypeFilter = document.getElementById('objectTypeFilter');
      var diagnosisTypeFilter = document.getElementById('diagnosisTypeFilter');
      var historyModal = document.getElementById('historyModal');
      var historyTbody = document.getElementById('historyTbody');
      var historyTotal = document.getElementById('historyTotal');
      var historyTitle = document.getElementById('historyTitle');
      var toast = document.getElementById('toast');
      var toastTimer = null;
      var activeTab = 'all';

      function statusClass(status) {
        if (status === '异常') return 'abnormal';
        if (status === '预警') return 'warning';
        return 'normal';
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 1800);
      }

      function renderRows() {
        var objectType = objectTypeFilter.value;
        var diagnosisType = diagnosisTypeFilter.value;
        var html = '';
        var visible = 0;

        ROWS.forEach(function (row, index) {
          var matchTab = activeTab === 'all' || row.pending;
          var matchObject = !objectType || row.objectType === objectType;
          var matchType = !diagnosisType || row.diagnosisType === diagnosisType;
          var show = matchTab && matchObject && matchType;
          if (show) visible += 1;

          html +=
            '<tr class="' + (show ? '' : 'is-hidden') + '" data-index="' + index + '">' +
              '<td>' + row.name + '</td>' +
              '<td>' + row.objectType + '</td>' +
              '<td>' + row.diagnosisType + '</td>' +
              '<td>' + row.indicator + '</td>' +
              '<td>' + row.value + '</td>' +
              '<td><span class="status-tag ' + statusClass(row.status) + '">' + row.status + '</span></td>' +
              '<td>' + row.time + '</td>' +
              '<td><div class="cell-clamp" title="' + row.impact.replace(/"/g, '&quot;') + '">' + row.impact + '</div></td>' +
              '<td><div class="cell-clamp" title="' + row.suggestion.replace(/"/g, '&quot;') + '">' + row.suggestion + '</div></td>' +
              '<td><button type="button" class="action-link" data-action="history">历史</button></td>' +
            '</tr>';
        });

        tbody.innerHTML = html;
        emptyState.style.display = visible ? 'none' : 'block';
        totalText.textContent = '共 ' + visible + ' 条';
      }

      function buildHistory(row) {
        var base = parseFloat(row.value) || 0;
        var items = [];
        for (var i = 0; i < 12; i++) {
          var hour = 17 - i;
          var day = hour >= 0 ? '2026-05-26' : '2026-05-25';
          var h = hour >= 0 ? hour : hour + 24;
          var val = (base + (i % 3 === 0 ? 0.4 : 0)).toFixed(2);
          var status = row.pending && i === 0 ? row.status : '正常';
          items.push({
            indicator: row.indicator,
            value: val,
            status: status,
            time: day + ' ' + String(h).padStart(2, '0') + ':00:00'
          });
        }
        return items;
      }

      function openHistory(index) {
        var row = ROWS[index];
        if (!row) return;
        historyTitle.textContent = '历史诊断 · ' + row.name + ' · ' + row.diagnosisType;
        var items = buildHistory(row);
        historyTbody.innerHTML = items.map(function (item) {
          return '<tr>' +
            '<td>' + item.indicator + '</td>' +
            '<td>' + item.value + '</td>' +
            '<td><span class="status-tag ' + statusClass(item.status) + '">' + item.status + '</span></td>' +
            '<td>' + item.time + '</td>' +
          '</tr>';
        }).join('');
        historyTotal.textContent = '共 ' + items.length + ' 条';
        historyModal.classList.add('show');
        historyModal.setAttribute('aria-hidden', 'false');
      }

      function closeHistory() {
        historyModal.classList.remove('show');
        historyModal.setAttribute('aria-hidden', 'true');
      }

      function initCharts() {
        if (typeof echarts === 'undefined') return;

        var pendingChart = echarts.init(document.getElementById('pendingChart'));
        pendingChart.setOption({
          color: ['#DC2626', '#16A34A', '#D97706'],
          tooltip: { trigger: 'item' },
          legend: { bottom: 0, textStyle: { color: '#475569', fontSize: 12 } },
          series: [{
            type: 'pie',
            radius: ['42%', '68%'],
            center: ['50%', '46%'],
            label: { formatter: '{b}\n{c}', fontSize: 12, color: '#0F172A' },
            data: [
              { name: '异常', value: 3 },
              { name: '正常', value: 9 },
              { name: '预警', value: 0 }
            ]
          }]
        });

        var top5Chart = echarts.init(document.getElementById('top5Chart'));
        top5Chart.setOption({
          color: ['#1E40AF'],
          grid: { left: 110, right: 24, top: 24, bottom: 28 },
          tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
          xAxis: {
            type: 'value',
            minInterval: 1,
            axisLabel: { color: '#94A3B8', fontSize: 11 },
            splitLine: { lineStyle: { color: '#EAF0F6' } }
          },
          yAxis: {
            type: 'category',
            data: ['冷冻侧流量异常震荡', '频率异常震荡', '压缩机过载', '电机过载', '频繁启停'].reverse(),
            axisLabel: { color: '#475569', fontSize: 11 },
            axisTick: { show: false },
            axisLine: { show: false }
          },
          series: [{
            type: 'bar',
            barWidth: 14,
            data: [2, 1, 2, 2, 5].reverse(),
            itemStyle: { borderRadius: [0, 6, 6, 0] }
          }]
        });

        window.addEventListener('resize', function () {
          pendingChart.resize();
          top5Chart.resize();
        });
      }

      document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.tab-btn').forEach(function (el) { el.classList.remove('active'); });
          btn.classList.add('active');
          activeTab = btn.getAttribute('data-tab');
          renderRows();
        });
      });

      objectTypeFilter.addEventListener('change', renderRows);
      diagnosisTypeFilter.addEventListener('change', renderRows);

      tbody.addEventListener('click', function (event) {
        var btn = event.target.closest('[data-action="history"]');
        if (!btn) return;
        var tr = btn.closest('tr');
        openHistory(Number(tr.getAttribute('data-index')));
      });

      document.getElementById('historyClose').addEventListener('click', closeHistory);
      historyModal.addEventListener('click', function (event) {
        if (event.target === historyModal) closeHistory();
      });

      document.getElementById('histStart').addEventListener('change', function () {
        showToast('已按时间范围筛选历史记录（原型示意）');
      });
      document.getElementById('histEnd').addEventListener('change', function () {
        showToast('已按时间范围筛选历史记录（原型示意）');
      });

      renderRows();
      initCharts();
    })();
  </script>
  <script src="components/nav.js" data-active-nav="AI智能能效" data-active-sidebar="冷站智能诊断"></script>
</body>
</html>
