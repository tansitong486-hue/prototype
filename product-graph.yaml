# 维护：改 nav.js / index 拓扑 / 主流程时同步本文件
# 更新：2026-07-31

meta:
  product: ai-energy
  canonical:
    status: 04-需求文档/00-版本需求清单.md
    nav: components/nav.js
    topology: index.html
    value_doc: ../../07-产品文档/01-ai 节能/产品文档/00-产品全貌.md
    agent_map: AGENT-MAP.md

domains:
  - id: domain.overview
    name: 总览
    value_prop: 一眼看清用能与能效
    related_flows: [flow.energy_config_to_consume]
  - id: domain.cold_station_opt
    name: 冷站 AI 节能
    value_prop: 整站最低能耗满足冷量
    related_flows: [flow.cold_station_opt_family, flow.cold_station_diagnosis]
  - id: domain.cold_station_diagnosis
    name: 冷站智能诊断
    value_prop: 设备与系统运行异常自动诊断与规则配置
    related_flows: [flow.cold_station_diagnosis]
  - id: domain.room_opt
    name: 机房末端节能
    value_prop: 开几台、怎么调最省电
    related_flows: [flow.room_opt_diagnosis]
  - id: domain.room_diagnosis
    name: 机房智能诊断
    value_prop: 调不动的根因预警
    related_flows: [flow.room_opt_diagnosis]
  - id: domain.sim_predict
    name: 建模与仿真
    value_prop: 可信预测与数字孪生
    related_flows: [flow.model_train_sim, flow.multi_condition_explore]
  - id: domain.safety_dispatch
    name: 安全与下发
    value_prop: 可渐进放权、可随时退出
    related_flows: [flow.config_crud_safety_dispatch]
  - id: domain.energy_metering
    name: 能耗计量
    value_prop: 表具到明细到成本
    related_flows: [flow.energy_config_to_consume]
  - id: domain.energy_consume
    name: 能耗消费分析
    value_prop: 效果可量化考核
    related_flows: [flow.energy_config_to_consume]
  - id: domain.data_quality
    name: 数据质量
    value_prop: 降低脏数据导致的训练好运行差
    related_flows: [flow.energy_config_to_consume, flow.model_train_sim]
  - id: domain.multi_condition
    name: 多工况探索
    value_prop: 主动补齐稀缺工况样本
    related_flows: [flow.multi_condition_explore]
  - id: domain.asset_model
    name: 物模型与系统类型
    value_prop: 水冷/风冷等对象底座
    related_flows: [flow.energy_config_to_consume, flow.model_train_sim]

