requirements:
  - id: req.v25.energy_metering
    version: v2.5
    status: 规划中
    domain: energy_metering
    prd_path: 04-需求文档/AI节能v2.5 版本/基于计费的能耗明细系统需求方案与架构.html
    prototype_pages:
      - 能耗管理-表具明细.html
      - 能源计量关系.html
      - 能源配置.html
      - 计费方案配置.html
      - 新增-编辑能源.html
      - 新增-编辑能源计费方案.html
      - 能效视图.html
      - 数据质量自检.html
    upstream: [req.v21.data_quality_selfcheck]
    downstream: [req.v25.energy_consume, req.v25.metric_selector]
    algo_vs_ui: mixed
    notes: 需求1–6明细引擎；独立页菜单名为“能源拓扑配置”（文件仍为能源计量关系.html），同时维护能耗计量与供电两类关系。对象树支持设备实例及下级组件实例作为计量对象，实例层级不自动生成计量关系；中间拓扑关系列表按成员合并展示只读关系标签；支持供电的列头柜 / 支路新增即同时创建两条独立关系，无关系类型选择，合并行的输入/输出仅作用于能耗计量关系，页面删除成员同时移除两条关系；历史单关系按实际展示并可补齐。表具池默认展示未完整关联对象，并在两行卡片内标识成员支持的拓扑关系。今日试算与 Excel 全局导入导出仅使用能耗计量关系，Excel 不带历史规则；每个对象在当前能源下自选历史数据计算规则，默认沿用最新拓扑，选项2按当时拓扑解释历史并支持指定日期用最新图重算。单对象配置仍在能效视图“能效配置”Tab，与独立页维护同一份关系数据；表具归档、数据质量校验与对象指标工厂构成下游消费链路；查询指标与实时历史跟同一套对象规则走。

  - id: req.v25.energy_consume
    version: v2.5
    status: 规划中
    domain: energy_consume
    prd_path: 04-需求文档/AI节能v2.5 版本/存量页面消费与总览看板改造需求方案.html
    prototype_pages:
      - 总览看板.html
      - 能耗流向分析.html
      - 用能对比分析.html
      - 用能趋势分析.html
      - 用能定额考核.html
      - 节能分析.html
    upstream: [req.v25.energy_metering]
    downstream: []
    algo_vs_ui: ui
    notes: 消费侧需求 7 用能对比分析（升级为标准化指标单选对比 A1/A2/B1–B5，命名沿用能效视图口径，无结果对象置灰不可选，含表格导出）、需求 8 用能趋势分析（仅消费查询类指标，最多 100 个对象按连续时间范围与小时/天/月聚合粒度形成折线/表格并导出）、需求 9 用能定额考核与需求 10 节能分析（存量页切指标工厂取数）、需求 11 总览看板（含明细/导出，不另开统计分析页）。实时值计算后写入时序存储，跨度统计按当前拓扑查询时计算。全版本已统一为需求 1–13 连续编号，早期的 8/9/16 等编号作废

  - id: req.v25.metric_selector
    version: v2.5
    status: 规划中
    domain: energy_consume
    prd_path: 04-需求文档/AI节能v2.5 版本/存量页面消费与总览看板改造需求方案.html
    prototype_pages: []
    upstream: [req.v25.energy_metering]
    downstream: []
    algo_vs_ui: ui
    notes: 平台侧（KE 报表报告 / 融合组态）把指标作为可选数据项开放给用户，消费侧需求 12 报表参数查询、需求 13 融合组态变量树，公共约束见消费侧册 §二。交互原型已内嵌于消费侧需求方案 HTML 各需求章（#原型-报表选择测点弹窗 / #原型-融合组态变量树选指标），需求说明写在原型下方，不再维护 AI原型html 独立页。前置为需求 6 指标选取服务（明细引擎册）。核心口径：选择器升级为「数据项选择器」，测点与指标显式双类型并列、互不伪装；两处组件互相独立可分别派工，但指标清单命名与可算状态必须同源于需求 6 接口

