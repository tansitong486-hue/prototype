<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>能耗智能管理 - 原型导航</title>
  <style>
    :root {
      --primary: #00C853;
      --primary-dark: #00A846;
      --bg: #F0F2F5;
      --card-bg: #FFFFFF;
      --text-main: #262626;
      --text-sub: #595959;
      --border: #E8E8E8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      margin-bottom: 40px;
      text-align: center;
    }
    .header h1 {
      font-size: 28px;
      margin: 0 0 10px 0;
    }
    .header p {
      color: var(--text-sub);
      margin: 0;
    }
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      justify-content: center;
    }
    .filter-btn {
      padding: 6px 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-sub);
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .module-section {
      background: #fff;
      border-radius: 12px;
      padding: 24px 32px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .module-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 24px 0;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .module-title::before {
      content: '';
      display: block;
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* 拓扑树状结构样式 */
    .tree {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .tree ul {
      margin: 16px 0 0 0;
      padding: 0 0 0 40px;
      list-style: none;
      position: relative;
    }
    /* 垂直辅助线 */
    .tree ul::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 20px;
      border-left: 2px solid var(--border);
    }
    .tree li {
      position: relative;
      margin-bottom: 16px;
      transition: opacity 0.3s;
    }
    .tree li:last-child {
      margin-bottom: 0;
    }
    /* 水平连接线 */
    .tree ul > li::before {
      content: '';
      position: absolute;
      top: 36px;
      left: -20px;
      width: 16px;
      border-top: 2px solid var(--border);
    }
    /* 遮罩最后一个子节点的下半段垂直线 */
    .tree ul > li:last-child::after {
      content: '';
      position: absolute;
      top: 38px;
      bottom: -16px;
      left: -22px;
      width: 6px;
      background: #fff;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 16px;
      width: fit-content;
      min-width: 450px;
      max-width: 100%;
      position: relative;
      z-index: 2;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0,200,83,0.12);
      border-color: var(--primary);
    }
    .card-main {
      flex: 1;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .version-tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 200, 83, 0.1);
      color: var(--primary-dark);
      font-weight: 500;
    }
    .card-desc {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
    }
    .arrow-icon {
      color: #BFBFBF;
      transition: color 0.2s, transform 0.2s;
    }
    .card:hover .arrow-icon {
      color: var(--primary);
      transform: translateX(4px);
    }
  </style>
</head>

    /** 从拓扑数据递归收集去重后的版本号，用于生成筛选按钮 */
    function collectVersionsFromTopology(data) {
      const set = new Set();
      function walk(node) {
        if (node.version) set.add(node.version);
        (node.children || []).forEach(walk);
      }
      data.forEach(function (m) {
        (m.nodes || []).forEach(walk);
      });
      return Array.from(set).sort();
    }

    function buildVersionFilterButtons() {
      const versions = collectVersionsFromTopology(topologyData);
      const filtersEl = document.getElementById('filters');
      versions.forEach(function (v) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'filter-btn';
        btn.dataset.version = v;
        btn.textContent = v;
        filtersEl.appendChild(btn);
      });
    }

    const container = document.getElementById('topology-container');
    const filters = document.getElementById('filters');

    buildVersionFilterButtons();

    // 判断节点及其子节点是否包含匹配版本的节点
    function hasMatchingNode(node, filterVersion) {
      if (filterVersion === 'all') return true;
      if (node.version === filterVersion) return true;
      if (node.children && node.children.length > 0) {
        return node.children.some(child => hasMatchingNode(child, filterVersion));
      }
      return false;
    }

    // 递归渲染节点
    function renderNode(node, filterVersion) {
      // 如果当前节点和子节点都不匹配，则直接返回空字符串（隐藏）
      if (!hasMatchingNode(node, filterVersion)) return '';

      const isMatch = filterVersion === 'all' || node.version === filterVersion;
      // 如果当前节点不匹配，但子节点匹配，则将当前节点置灰（作为占位），否则正常显示
      const opacity = isMatch ? '1' : '0.35';
      const pointerEvents = isMatch ? 'auto' : 'none';

      let html = `<li style="opacity: ${opacity}; pointer-events: ${pointerEvents}">`;
      html += `
        <a href="${node.file}" class="card">
          <div class="card-main">
            <div class="card-title">
              ${node.title}
              <span class="version-tag">${node.version}</span>
            </div>
            <div class="card-desc">${node.desc}</div>
          </div>
          <svg class="arrow-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18l6-6-6-6"/></svg>
        </a>
      `;
      
      if (node.children && node.children.length > 0) {
        const childrenHtml = node.children.map(child => renderNode(child, filterVersion)).join('');
        if (childrenHtml) {
          html += `<ul>${childrenHtml}</ul>`;
        }
      }
      
      html += '</li>';
      return html;
    }

    // 渲染整个拓扑图
    function renderTopology(filterVersion) {
      container.innerHTML = '';
      topologyData.forEach(module => {
        // 检查整个模块是否有匹配的节点
        const moduleHasMatch = module.nodes.some(node => hasMatchingNode(node, filterVersion));
        if (!moduleHasMatch) return; // 如果模块内没有任何匹配节点，则隐藏整个模块

        const section = document.createElement('div');
        section.className = 'module-section';
        
        let nodesHtml = '<ul class="tree">';
        module.nodes.forEach(node => {
          nodesHtml += renderNode(node, filterVersion);
        });
        nodesHtml += '</ul>';

        section.innerHTML = `
          <h2 class="module-title">${module.module}</h2>
          ${nodesHtml}
        `;
        container.appendChild(section);
      });
    }

    // 绑定筛选事件（用 closest：避免点击到 button 内文本节点时 e.target 无 classList 导致整段脚本报错、筛选失效）
    filters.addEventListener('click', e => {
      const t = e.target;
      const root = t.nodeType === Node.TEXT_NODE ? t.parentElement : t;
      const btn = root && root.closest ? root.closest('.filter-btn') : null;
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const ver = btn.getAttribute('data-version') || 'all';
      renderTopology(ver);
    });

    // 初始渲染
    renderTopology('all');
  </script>
</body>
</html>
