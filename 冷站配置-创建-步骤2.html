<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>冷站配置 · 设备与属性 - AI 智控中枢</title><style>
    :root {
      --primary: #1E40AF;
      --primary-light: #EEF4FF;
      --primary-dark: #17358A;
      --secondary: #3B82F6;
      --cta: #F59E0B;
      --success: #16A34A;
      --success-light: #F0FDF4;
      --warning: #D97706;
      --warning-light: #FFF7ED;
      --danger: #DC2626;
      --danger-light: #FEF2F2;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-hint: #94A3B8;
      --border: #D8E1EB;
      --border-light: #EAF0F6;
      --bg-body: #F8FAFC;
      --bg-card: #FFFFFF;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
      --shadow-card: 0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.04);
      --transition: .2s cubic-bezier(.4,0,.2,1);
      --sidebar-bg: #071B2E;
      --header-bg: #071B2E;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-body);
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; cursor: pointer; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 3px; }

    .layout { display: flex; flex-direction: column; min-height: 100vh; }
    .body-wrap { display: flex; flex: 1; min-height: 0; }
    .main { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg-body); }

    .page-header {
      background: var(--bg-card);
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--primary); }
    .back-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

    .progress-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 0;
      background: var(--bg-body);
    }
    .progress-steps {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .progress-step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .progress-step.active {
      color: var(--primary);
      font-weight: 600;
    }
    .step-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }
    .step-icon.active {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
    }
    .step-icon.pending {
      background: #fff;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .progress-line {
      width: 120px;
      height: 2px;
      background: #E2E8F0;
    }

    .content-body { padding: 0 20px 24px; display: flex; flex-direction: column; gap: 16px; }

    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .section-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      background: #fff;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-head::before {
      content: '';
      display: block;
      width: 3px;
      height: 14px;
      background: var(--primary);
      border-radius: 2px;
    }

    .section-body { padding: 18px; }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px 24px;
      margin-bottom: 16px;
    }
    .form-row:last-child { margin-bottom: 0; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .field-label .required { color: var(--danger); }
    .field-control, .field-select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      background: #fff;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .field-control:focus-visible, .field-select:focus-visible {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30,64,175,.12);
    }
    .field-hint {
      font-size: 12px;
      color: var(--text-hint);
      line-height: 1.5;
    }
    .field-inline { display: flex; align-items: center; gap: 8px; }
    .field-suffix { font-size: 13px; color: var(--text-secondary); }

    .table-wrap { overflow-x: auto; }
    .data-table {
      width: 100%;
      min-width: 880px;
      border-collapse: collapse;
    }
    .data-table thead th {
      padding: 10px 12px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .data-table tbody td {
      padding: 10px 12px;
      font-size: 13px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }
    .data-table tbody tr:hover { background: #FAFCFF; }
    .radio-group {
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }
    .radio-group label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: normal;
    }
    .radio-group input[type="radio"] {
      margin: 0;
    }
    .action-link {
      font-size: 12px;
      cursor: pointer;
      color: var(--primary);
      transition: opacity .2s;
    }
    .action-link:hover { opacity: .85; }
    .action-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 2px; }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: transparent;
    }
    .btn-primary:hover { background: var(--primary-dark); color: #fff; }
    .btn-primary:focus-visible { outline: 2px solid var(--cta); outline-offset: 2px; }

    .foot-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px 20px;
      border-top: 1px solid var(--border-light);
      background: #FBFCFE;
      margin: 0 -18px -18px;
    }

    .note-block {
      padding: 10px 12px;
      background: #F8FAFC;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 14px;
    }


    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }

    /* ── 通道分组配置 ── */
    .channel-subsection { margin-bottom: 4px; }
    .channel-subsection-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-light);
    }
    .channel-subsection-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .channel-type-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot-cold { background: #3B82F6; }
    .dot-hot  { background: #EF4444; }
    .group-card {
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      margin-bottom: 8px;
      background: #FAFCFF;
    }
    .group-card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #F4F7FD;
      border-radius: var(--radius) var(--radius) 0 0;
      border-bottom: 1px solid var(--border-light);
    }
    .group-name-input {
      flex: 1;
      min-width: 0;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      background: #fff;
    }
    .group-name-input:focus-visible { outline: none; border-color: var(--primary); }
    .group-card-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .group-card-body { padding: 10px 12px; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 20px; }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.4;
    }
    .tag-sensor  { background: #EEF4FF; color: #1E40AF; }
    .tag-cabinet { background: #FFF7ED; color: #D97706; }
    .tag-remove {
      border: none;
      background: none;
      cursor: pointer;
      padding: 0 1px;
      font-size: 13px;
      line-height: 1;
      opacity: .6;
      color: inherit;
    }
    .tag-remove:hover { opacity: 1; }
    .section-empty { font-size: 12px; color: var(--text-hint); font-style: italic; line-height: 2; }

    /* ── 通用关联弹窗 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.4);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.is-open { display: flex; }
    .modal-dialog {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 48px rgba(15,23,42,.16);
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-close {
      width: 28px;
      height: 28px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: var(--border-light); color: var(--text-primary); }
    .modal-close:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .modal-body {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .modal-left {
      flex: 1;
      min-width: 0;
      padding: 16px 20px;
      overflow-y: auto;
      border-right: 1px solid var(--border-light);
    }
    .modal-filters {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .modal-filters .field-control { width: 180px; }
    .modal-filters .field-select { min-width: 160px; }
    .modal-table-wrap { overflow-x: auto; margin-bottom: 12px; }
    .modal-table-wrap .data-table { min-width: 400px; }
    .modal-table-wrap th:first-child,
    .modal-table-wrap td:first-child { width: 40px; text-align: center; }
    .modal-pagination {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .modal-pagination button {
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .modal-pagination button:hover { border-color: var(--primary); color: var(--primary); }
    .modal-pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .modal-right {
      width: 240px;
      flex-shrink: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-light);
    }
    .modal-right-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .modal-selected-list {
      flex: 1;
      min-height: 80px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .modal-selected-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 4px;
      margin-bottom: 4px;
      background: #F8FAFC;
    }
    .modal-selected-item .remove-btn {
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-hint);
      padding: 0 4px;
      font-size: 14px;
      line-height: 1;
    }
    .modal-selected-item .remove-btn:hover { color: var(--danger); }
    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    /* ── v2.9 机房配置：空调表固定列 + 按物模型属性定义渲染的属性区 ── */
    .type-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .type-name { font-weight: 500; }
    .type-chain { font-size: 11px; color: var(--text-hint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .type-chain b { color: var(--text-secondary); font-weight: 500; }
    .sub-text { font-size: 11px; color: var(--text-hint); line-height: 1.5; }
    .ready-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .ready-ok    { background: var(--success-light); color: var(--success); }
    .ready-warn  { background: var(--warning-light); color: var(--warning); }
    .ready-error { background: var(--danger-light);  color: var(--danger); }
    .ready-off   { background: #F1F5F9; color: var(--text-hint); }
    .prop-toggle { font-size: 12px; color: var(--primary); cursor: pointer; white-space: nowrap; background: none; border: none; padding: 0; font-family: inherit; }
    .prop-toggle:hover { opacity: .85; }
    .prop-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 2px; }
    tr.prop-row td { background: #FAFCFF; padding: 0 12px 14px; }
    tr.prop-row.is-collapsed { display: none; }
    .data-table tbody tr.prop-row:hover { background: #FAFCFF; }
    .prop-panel { border: 1px dashed var(--border); border-radius: var(--radius); background: #fff; padding: 10px 12px; }
    .prop-panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
    .prop-panel-head code, .prop-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--primary); background: var(--primary-light); padding: 0 4px; border-radius: 3px; font-weight: 400; }
    .prop-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 14px; }
    .prop-item { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .prop-label { font-size: 12px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .prop-label .required { color: var(--danger); }
    .prop-value { display: flex; align-items: center; gap: 6px; }
    .prop-value .field-control, .prop-value .field-select { flex: 1; min-width: 0; padding: 5px 8px; font-size: 12px; background: #F8FAFC; color: var(--text-primary); }
    .prop-value .field-control[readonly] { cursor: default; }
    .prop-value .field-select:disabled { cursor: default; opacity: 1; color: var(--text-primary); -webkit-text-fill-color: var(--text-primary); }
    .prop-unit { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
    .prop-item.is-missing .field-control, .prop-item.is-missing .field-select { border-color: var(--danger); background: var(--danger-light); color: var(--danger); -webkit-text-fill-color: var(--danger); }
    .prop-item.is-missing .prop-label { color: var(--danger); }
    .btn-maintain { font-size: 11px; padding: 3px 8px; border: 1px solid var(--danger); color: var(--danger); background: #fff; border-radius: 4px; cursor: pointer; white-space: nowrap; font-family: inherit; }
    .btn-maintain:hover { background: var(--danger-light); }
    .btn-maintain:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }
    .prop-derived { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-light); font-size: 12px; color: var(--text-secondary); display: flex; gap: 16px; flex-wrap: wrap; }
    .prop-derived b { color: var(--text-primary); font-weight: 600; }
    /* 模型就绪校验结果面板 */
    .check-summary { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
    .check-summary b { color: var(--text-primary); }
    .check-table td.lvl { font-weight: 600; white-space: nowrap; }
    .lvl-error { color: var(--danger); }
    .lvl-warn  { color: var(--warning); }
    .lvl-info  { color: var(--text-hint); }
    .lvl-pass  { color: var(--success); }
    .code-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #F1F5F9; color: var(--text-secondary); white-space: nowrap; }
    .code-tag.err  { background: var(--danger-light);  color: var(--danger); }
    .code-tag.warn { background: var(--warning-light); color: var(--warning); }
    .check-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--text-secondary); }
    .toast {
      position: fixed; right: 24px; bottom: 72px; min-width: 180px; max-width: 360px;
      padding: 12px 14px; border-radius: 10px; background: rgba(15, 23, 42, 0.92); color: #fff;
      font-size: 12px; line-height: 1.6; white-space: pre-line; box-shadow: 0 14px 34px rgba(15, 23, 42, 0.28);
      opacity: 0; transform: translateY(12px); pointer-events: none; transition: all .25s ease; z-index: 1200;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    /* 2026-10-31：属性页内直接编辑 + 批量复制 */
    .prop-value .field-control, .prop-value .field-select { background: #fff; }
    .prop-item.is-invalid .field-control, .prop-item.is-invalid .field-select { border-color: var(--danger); }
    .prop-item.is-invalid .prop-label { color: var(--danger); }
    .prop-item.is-edited:not(.is-missing):not(.is-invalid) .field-control,
    .prop-item.is-edited:not(.is-missing):not(.is-invalid) .field-select { border-color: var(--secondary); background: #F5F9FF; }
    .prop-err { display: none; font-size: 11px; color: var(--danger); line-height: 1.4; }
    .prop-item.is-invalid .prop-err { display: block; }
    .edit-tag { display: none; font-size: 10px; padding: 0 5px; border-radius: 3px; background: var(--primary-light); color: var(--primary); font-weight: 500; }
    .prop-item.is-edited .edit-tag { display: inline-block; }
    .edit-count { color: var(--primary); }
    .btn.btn-sm { padding: 3px 10px; font-size: 11px; }
    .copy-body { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .copy-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
    .copy-label { font-size: 13px; font-weight: 600; min-width: 72px; }
    .copy-sec { border: 1px solid var(--border-light); border-radius: var(--radius); overflow: hidden; }
    .copy-sec-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #F8FAFC; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--border-light); }
    .copy-sec-head label { font-weight: 400; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    .copy-props { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; padding: 10px 12px; }
    .copy-check { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 1.5; cursor: pointer; }
    .copy-check input { margin-top: 3px; }

let importPlan=null;
function openImport(){importPlan=null;openModal('导入属性表',anno('导入属性表弹窗；入口：工具栏导入属性表',['读取真实 xlsx 或 CSV，预检对象归属、属性适用性、格式和范围。','问题行列出原因；确认前不修改草稿，不增减设备和分组。','风冷不接受板换、冷却侧属性；制冷模式仅可为压缩制冷。','预览填入、覆盖和跳过数量；空值与自动计算值不覆盖。'],'4.3','field')+`<label class="field-label" for="importFile">选择文件</label><div class="toolbar"><input type="file" id="importFile" accept=".csv,.xlsx"><button class="btn" id="demoFile">使用演示文件</button></div><div id="importFileName" class="sub-text">尚未选择文件</div><div id="importResult" class="note-block">选择文件后显示预检结果</div>`,applyImport,'确认导入',true);$('#modalConfirm').disabled=true;$('#demoFile').onclick=()=>demoImport('演示属性表.xlsx');$('#importFile').onchange=async()=>{const file=$('#importFile').files[0];if(!file)return;importPlan=null;$('#modalConfirm').disabled=true;try{precheckImport(workbookEntries(await XlsxMini.read(file)),file.name);}catch(error){$('#importResult').textContent='文件未导入：'+error.message;toast('文件无法读取：'+error.message);}};}
function demoImport(name){const d=devices.find(x=>x.id==='CH6')||devices.find(x=>x.group==='CH'),pump=devices.find(x=>x.model==='水泵'),tower=devices.find(x=>x.group==='CT');if(!d){toast('请先关联设备，再使用演示文件');return;}const entries=propsOf(d).filter(p=>p.id!=='InputOrOutput'&&!p.options).slice(0,6).map((p,i)=>({row:i+2,object:d.name,attr:p.id,value:String(defaults[p.id]||'10')}));entries.push({row:9,object:pump?.name||d.name,attr:pump?'flow':'minLoad',value:'超出范围'},{row:10,object:tower?.name||d.name,attr:tower?'fans_num':'chillerRatio',value:tower?'2.5':'1.5'},{row:11,object:'10#冷水主机',attr:'RatedCool',value:'3868'});precheckImport(entries,name);}
function allObjects(){
 const objects=[{id:'system',name:draft.name||'新建冷水系统',model:'水冷冷水系统',attrs:draft.attributes},...devices],seen=new Set(['system',...devices.map(d=>d.id)]);
 const models={tower:'并联冷却塔管路',second:'并联二次泵管路',tank:'蓄冷罐设备组'};
 for(const g of draft.topology?.groups||[]){if(!models[g.type]||seen.has(g.id))continue;seen.add(g.id);objects.push({id:g.id,name:g.name,model:models[g.type],attrs:g.attrs});}
 for(const g of (draft.topology?[]:draft.groupAttributes||[])){if(!seen.has(g.id)){seen.add(g.id);objects.push(g);}}return objects;
}
function importProps(d){return (DEFS[d.model]||[]).filter(p=>draft.systemType!=='air'||(p.id!=='cool_pressure_diff'&&!['板式换热器','冷却塔','并联冷却塔管路'].includes(d.model)));}
function headerFor(p){const range=p.options?p.options.map(o=>o[1]).join(' / '):p.min!==undefined?p.min+'～'+p.max:p.integer?'整数':'数值';return p.name+'（'+[p.unit,range,p.required?'必填':'选填',p.readonly?'自动计算':''].filter(Boolean).join('；')+'）';}
function workbookEntries(sheets){const entries=[];for(const sheet of sheets){const rows=sheet.rows.filter(r=>r.some(v=>String(v).trim())),header=rows[0]||[],oi=header.indexOf('对象'),ii=header.indexOf('对象编号'),ai=header.indexOf('属性标识'),vi=header.indexOf('值');if(oi<0)throw Error('工作表“'+sheet.name+'”缺少“对象”列');if(ai>=0&&vi>=0){rows.slice(1).forEach((r,i)=>entries.push({sheet:sheet.name,row:i+2,object:r[oi],attr:r[ai],value:r[vi]}));continue;}
 for(let i=1;i<rows.length;i++){const row=rows[i],object=allObjects().find(d=>ii>=0&&d.id===row[ii])||allObjects().find(d=>d.name===row[oi]);for(let j=0;j<header.length;j++){if(j===oi||j===ii||header[j]==='对象类型')continue;const title=String(header[j]).split('（')[0],prop=(DEFS[object?.model]||[]).find(p=>p.name===title||p.id===title);if(empty(row[j]))continue;entries.push({sheet:sheet.name,row:i+1,object:row[oi],objectId:ii>=0?row[ii]:undefined,attr:prop?.id||title,value:row[j]});}}
 }return entries;}
function precheckImport(entries,name){const plan={fill:[],overwrite:[],skip:[],issues:[]},seen=new Set();for(const raw of entries){const e={...raw},d=allObjects().find(d=>e.objectId?d.id===e.objectId:d.name===e.object),p=d&&importProps(d).find(p=>p.id===e.attr);if(p?.options){const convert=v=>p.options.find(o=>o[0]===String(v)||o[1]===String(v))?.[0]??v;e.value=p.multiple?(Array.isArray(e.value)?e.value:String(e.value).split('|')).map(convert):convert(e.value);}else if(e.value!=null)e.value=String(e.value);
 let problem='';const key=(d?.id||e.object)+'|'+e.attr;
 if(!d)problem='对象不在本配置或不适用于当前系统，已跳过';else if(!p)problem='此属性不适用于当前系统，已跳过';else if(p.readonly)problem='自动计算属性不可导入，已跳过';else if(d.id==='system'&&draft.systemType==='air'&&p.id==='coolmode'&&JSON.stringify(e.value)!=='["0"]')problem='风冷系统制冷模式固定为压缩制冷，其他模式不可导入';else if(seen.has(key))problem='重复属性行，已跳过';else if(propError(p,e.value))problem=propError(p,e.value);else if(empty(e.value))problem='空值不覆盖，已跳过';
 if(problem){plan.skip.push(e);plan.issues.push({...e,problem});continue;}seen.add(key);const entry={...e,d,key:e.attr};if(JSON.stringify(d.attrs[e.attr])===JSON.stringify(e.value))plan.skip.push(e);else if(empty(d.attrs[e.attr]))plan.fill.push(entry);else plan.overwrite.push(entry);}
 importPlan=plan;$('#importFileName').textContent=name;$('#importResult').innerHTML=`<b>预检完成</b><p>将填入 ${plan.fill.length} 项 / 覆盖 ${plan.overwrite.length} 项 / 跳过 ${plan.skip.length} 项</p>${plan.issues.length?`<table class="data-table import-table"><thead><tr><th>工作表 / 行</th><th>对象</th><th>问题</th></tr></thead><tbody>${plan.issues.map(x=>`<tr><td>${esc(x.sheet||'属性表')} / ${x.row}</td><td>${esc(x.object)}</td><td class="missing-text">${esc(x.problem)}</td></tr>`).join('')}</tbody></table>`:'<p>没有发现格式或归属问题</p>'}`;$('#modalConfirm').disabled=!(plan.fill.length+plan.overwrite.length);
}
function applyImport(){if(!importPlan||readonly)return;const p=importPlan;[...p.fill,...p.overwrite].forEach(x=>{x.d.attrs[x.key]=x.value;const mirror=draft.groupAttributes?.find(g=>g.id===x.d.id);if(mirror)mirror.attrs[x.key]=clone(x.value);});markDirty();closeModal();renderDevices();toast(`已回填 ${p.fill.length+p.overwrite.length} 项属性，${p.skip.length} 项已跳过`);}
function exportAttributes(){try{const objects=allObjects(),makeSheet=(name,items)=>{const props=[...new Map(items.flatMap(d=>importProps(d)).map(p=>[p.id,p])).values()];return {name,colWidths:[20,32,18,...props.map(()=>30)],rows:[['对象类型','对象','对象编号',...props.map(headerFor)],...items.map(d=>[d.model,d.name,d.id,...props.map(p=>{const v=d.attrs[p.id];if(p.options){const label=x=>p.options.find(o=>o[0]===String(x))?.[1]??x;return Array.isArray(v)?v.map(label).join('|'):label(v??'');}return Array.isArray(v)?v.join('|'):v??'';})]) ]};};const sheets=[makeSheet('系统属性',objects.filter(d=>d.id==='system'))];for(const g of groups){const items=objects.filter(d=>d.group===g.key);if(items.length)sheets.push(makeSheet(g.name,items));}sheets.push(makeSheet('分组属性',objects.filter(d=>!d.group&&d.id!=='system')));XlsxMini.write((draft.name||'冷站配置')+'-属性表.xlsx',sheets);toast('已导出 Excel 属性表，可离线填写后导入');}catch(error){toast('无法导出属性表：'+error.message);}}

$('#versionHead').innerHTML=version('新增冷站设备关联、属性编辑和批量填写。','三步配置的第二步；属性缺失留待保存后校验，格式错误需先修正。');$('#pageTitle').textContent=(readonly?'查看':mode==='edit'?'编辑':'新建')+'冷站配置';$('#systemCaption').textContent=(draft.name||'新建冷水系统')+' · '+(draft.systemType==='air'?'风冷':'水冷')+' · 设备与属性';$('#steps').innerHTML=steps(2);
$('#toolbarAnno').innerHTML=anno('批量属性工具栏',['导出当前系统属性、按设备类型拆分的设备属性及分组属性。','正式导出为 xlsx：系统一个 sheet、设备按类型分 sheet、分组一个 sheet，表头含单位、范围、必填。','导入真实 xlsx 或 CSV 后预检；确认仅修改草稿，随步骤 3 完成保存。'],'4.3','ux');
$('#flowAnno').innerHTML=anno('步骤切换',['上一步保留草稿并返回系统信息；下一步保留草稿并进入系统拓扑。','有格式错误时阻止下一步，展开第一处错误并定位。','必填未填不拦下一步；取消确认后清理整个流程草稿。','处置入口定位设备和属性；保存后返回来源页并重新校验。'],'4.3','ux');
$('#demoAnno').innerHTML=anno('原型演示场景',['“默认配置”恢复当前系统演示数据；“格式错误”演示 1# 主机额定制冷量格式错误。','原型演示仅用于评审，不是正式产品功能。','有本页修改时切换演示需确认，避免丢失评审操作。'],'4.3','ux',true);
$('#export').onclick=exportAttributes;$('#import').onclick=openImport;$('#import').hidden=readonly;if(readonly)$('#pageTitle').closest('.page-header').querySelector('.demo-switch').hidden=true;
function focusError(){const errors=devices.flatMap(d=>propsOf(d).filter(p=>propError(p,d.attrs[p.id])).map(p=>({d,p})));if(!errors.length)return false;const {d,p}=errors[0];expanded.add(d.id);renderDevices();const el=$(`[data-key="${d.id}"][data-prop="${p.id}"]`);el?.focus();el?.scrollIntoView({block:'center',behavior:'smooth'});toast(`${errors.length} 项属性格式不正确`);return true;}
$('#next').onclick=()=>{if(!readonly&&focusError())return;markDirty();if(saveDraft(draft))location.href=navUrl(FILES.three);};$('#previous').onclick=()=>{if(saveDraft(draft))location.href=navUrl(FILES.one,{resume:'1'});};$('#cancel').hidden=readonly;$('#backList').hidden=false;function leave(){confirmLeave(dirty||!!Store.getDraft(configId),()=>{Store.clearDraft();location.href=back||FILES.list;});}$('#cancel').onclick=leave;$('#backList').onclick=readonly?()=>location.href=back||FILES.list:leave;
$$('[data-demo]').forEach(b=>b.onclick=()=>{const apply=()=>{const fresh=freshDraft(configId);draft=fresh;devices=groups.flatMap(g=>Array.from({length:g.key==='TK'?(draft.id==='C'?3:2):(draft.units||6)},(_,i)=>makeDevice(g,i+1)));draft.devices=devices;if(b.dataset.demo==='error')devices.find(x=>x.group==='CH').attrs.RatedCool='abc';markDirty();renderDevices();$$('[data-demo]').forEach(x=>x.classList.toggle('is-active',x===b));closeModal();toast('已切换原型演示');};if(dirty)openModal('切换原型演示？',anno('演示切换确认弹窗；入口：页头原型演示',['切换将替换本页的演示设备与属性。','确认后恢复对应示例；取消保留当前内容。','仅用于原型评审。'],'4.3','ux',true)+'<p>切换会清除当前演示修改，是否继续？</p>',apply,'切换演示');else apply();});
renderDevices();
const located=params.get('dev')||new URLSearchParams(params.get('step')||'').get('dev'),attr=params.get('attr')||new URLSearchParams(params.get('step')||'').get('attr');if(located){const d=devices.find(x=>x.id===located);if(d){expanded.add(d.id);renderDevices();setTimeout(()=>{const el=attr?$(`[data-key="${d.id}"][data-prop="${attr}"]`):$(`[data-device-row="${d.id}"]`);el?.scrollIntoView({block:'center'});el?.focus();if(el)el.closest('.prop-item')?.classList.add('located');},100);}}


// 单独进入时只读生效快照；必须明确选择后才恢复同 ID 草稿。
function offerDraftRecovery(){
 const old=Store.getDraft(configId);if(readonly||!old||params.get('resume')==='1'||params.get('from')==='energyView')return;
 const main=document.querySelector('main.main');const bar=document.createElement('div');bar.className='banner';
 bar.innerHTML=anno('未保存修改',['同一配置有未保存草稿时，可恢复继续编辑或丢弃。','恢复后保留进入编辑时的保存版本作为基线。','丢弃只清理草稿，已保存配置保持不变。'],'4.5','ux')+'有未保存的修改：<button class="btn" id="restoreDraft">恢复</button> <button class="btn" id="discardDraft">丢弃</button>';
 const children=Array.from(main.children);children.forEach(el=>el.inert=true);main.prepend(bar);
 const reload=resume=>{const q=new URLSearchParams(location.search);q.set('id',configId);q.set('mode',mode);q.set('resume',resume?'1':'0');location.replace(location.pathname+'?'+q);};
 bar.querySelector('#restoreDraft').onclick=()=>reload(true);bar.querySelector('#discardDraft').onclick=()=>{Store.clearDraft();reload(false);};
}
if(back){const link=document.createElement('a');link.className='return-link';link.textContent=Store.backLabel(back);link.href=back;link.onclick=e=>{if(readonly)return;e.preventDefault();leave();};(document.querySelector('.page-header-right')||document.querySelector('.page-header')).append(link);}
offerDraftRecovery();


// 多选属性：可见的勾选胶囊同步到隐藏的 select，沿用原有 change 处理
document.addEventListener('change',e=>{const cb=e.target.closest?.('[data-sync]');if(!cb)return;const sel=document.getElementById(cb.dataset.sync);if(!sel)return;const group=cb.closest('.pill-group');const on=new Set(Array.from(group.querySelectorAll('input[data-sync]')).filter(x=>x.checked).map(x=>x.value));Array.from(sel.options).forEach(o=>o.selected=on.has(o.value));group.querySelectorAll('.check-pill').forEach(l=>l.classList.toggle('selected',l.querySelector('input').checked));sel.dispatchEvent(new Event('change',{bubbles:true}));});
