<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冷站配置 - 系统拓扑</title><style>
    :root {
      --primary: #1E40AF;
      --primary-light: #EEF4FF;
      --primary-dark: #17358A;
      --secondary: #3B82F6;
      --cta: #F59E0B;
      --success: #16A34A;
      --danger: #DC2626;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-hint: #94A3B8;
      --border: #D8E1EB;
      --border-light: #EAF0F6;
      --bg-body: #F8FAFC;
      --bg-card: #FFFFFF;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.04);
      --shadow-card: 0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.04);
      --transition: .2s cubic-bezier(.4,0,.2,1);
      --sidebar-bg: #071B2E;
      --header-bg: #071B2E;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    .body-wrap { display: flex; flex: 1; min-height: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-body);
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; cursor: pointer; }
    .layout { display: flex; flex-direction: column; min-height: 100vh; }
    .main { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg-body); }
    @media (max-width: 900px) { .sidebar { display: none; } }

    .page-header {
      background: var(--bg-card);
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--primary); }
    .back-link:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

    .progress-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 0;
      background: var(--bg-body);
    }
    .progress-steps {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .progress-step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .progress-step.active {
      color: var(--primary);
      font-weight: 600;
    }
    .step-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }
    .step-icon.done {
      background: #fff;
      color: var(--success);
      border: 1px solid var(--success);
    }
    .step-icon.active {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--primary);
    }
    .progress-line {
      width: 120px;
      height: 2px;
      background: #E2E8F0;
    }
    .progress-line.active {
      background: var(--success);
    }

    .content-body { padding: 0 20px 24px; display: flex; gap: 16px; }
    .content-left { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .content-right { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; }

    .panel-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 20px;
      height: 100%;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .panel-title::before {
      content: '';
      display: block;
      width: 3px;
      height: 14px;
      background: var(--primary);
      border-radius: 2px;
    }

    .topology-wrap {
      flex: 1;
      position: relative;
      background: #F8FAFC;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .topology-svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 500px;
      font-family: sans-serif;
    }
    .target-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 32px;
      height: 32px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
    }
    .target-btn:hover { color: var(--primary); border-color: var(--primary); }

    .node-ac-rect { fill: #EEF4FF; stroke: var(--secondary); stroke-width: 1.5; rx: 8; }
    .node-ac-text { font-size: 12px; fill: var(--text-primary); font-weight: 600; }
    .node-ac-sub { font-size: 10px; fill: var(--text-secondary); }
    .node-cold-circle { fill: #E0F2FE; stroke: #0EA5E9; stroke-width: 1.5; }
    .node-hot-circle { fill: #FEF2F2; stroke: var(--danger); stroke-width: 1.5; }
    .node-val { font-size: 12px; fill: var(--text-primary); font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
    .node-label { font-size: 12px; fill: var(--text-primary); font-weight: 600; text-anchor: middle; }

    .edge-line { fill: none; stroke-width: 1.5; }
    .edge-cold { stroke: #3B82F6; }
    .edge-hot { stroke: #F59E0B; }
    .edge-pill { fill: #fff; stroke-width: 1; rx: 10; }
    .edge-pill.cold { stroke: #3B82F6; }
    .edge-pill.hot { stroke: #F59E0B; }
    .edge-pill-text { font-size: 10px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
    .edge-pill-text.cold { fill: #3B82F6; }
    .edge-pill-text.hot { fill: #F59E0B; }
    .edge-return { stroke: #DC2626; stroke-dasharray: 4 3; }

    .toolbar-row { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-primary);
      transition: border-color var(--transition), background-color var(--transition), color var(--transition);
    }
    .btn:hover { border-color: var(--secondary); color: var(--primary); }
    .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: #fff; }
    .btn-primary:focus-visible { outline: 2px solid var(--cta); outline-offset: 2px; }

    .field { margin-bottom: 12px; }
    .field-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .field-control {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      font-size: 13px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .field-control:focus-visible {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30,64,175,.12);
    }
    .field-select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      font-size: 13px;
      cursor: pointer;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .field-select:focus-visible {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30,64,175,.12);
    }

    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th, .data-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-light); }
    .data-table th { font-weight: 600; color: var(--text-secondary); font-size: 12px; }
    .data-table tbody tr { transition: background-color var(--transition); }
    .data-table tbody tr:hover { background: #F8FAFC; }

    .foot-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 16px 20px;
      border-top: 1px solid var(--border-light);
      background: #fff;
      gap: 12px;
    }

    /* 同步3D配置弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.4);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.is-open { display: flex; }
    .modal-dialog {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 48px rgba(15,23,42,.16);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-close {
      width: 28px;
      height: 28px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: var(--border-light); color: var(--text-primary); }
    .modal-close:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .modal-body { padding: 20px; }
    .modal-body .field { margin-bottom: 16px; }
    .modal-body .field-label { margin-bottom: 6px; }
    .field-hint {
      font-size: 12px;
      color: var(--text-hint);
      line-height: 1.6;
      margin-top: 12px;
    }
    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .required { color: #DC2626; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }

    /* 级联选择器：楼层 → 机房 */
    .cascade-select {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      overflow: hidden;
      height: 180px;
    }
    .cascade-col {
      flex: 1;
      overflow-y: auto;
      border-right: 1px solid var(--border-light);
    }
    .cascade-col:last-child { border-right: none; }
    .cascade-col-header {
      padding: 6px 10px;
      font-size: 11px;
      color: var(--text-hint);
      background: #F8FAFC;
      border-bottom: 1px solid var(--border-light);
      font-weight: 500;
    }
    .cascade-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-primary);
      transition: background var(--transition);
      gap: 4px;
    }
    .cascade-item:hover { background: var(--primary-light); }
    .cascade-item.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 500;
    }
    .cascade-item.selected {
      background: #DCFCE7;
      color: var(--success);
      font-weight: 500;
    }
    .cascade-item .cascade-arrow {
      font-size: 11px;
      color: var(--text-hint);
      flex-shrink: 0;
    }
    .cascade-selected-val {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      min-height: 18px;
    }
    .cascade-selected-val span {
      color: var(--primary);
      font-weight: 500;
    }

    /* 多选供冷关系 */
    .multi-select-wrap {
      position: relative;
    }
    .multi-select-trigger {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      min-height: 34px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      transition: border-color var(--transition);
    }
    .multi-select-trigger:hover { border-color: var(--primary); }
    .multi-select-trigger.is-open { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30,64,175,.12); }
    .ms-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .ms-tag-remove {
      border: none;
      background: none;
      cursor: pointer;
      color: var(--primary);
      padding: 0;
      font-size: 13px;
      line-height: 1;
      opacity: .7;
    }
    .ms-tag-remove:hover { opacity: 1; }
    .ms-placeholder { font-size: 12px; color: var(--text-hint); }
    .ms-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 12px rgba(15,23,42,.1);
      z-index: 200;
      max-height: 180px;
      overflow-y: auto;
    }
    .ms-dropdown.is-open { display: block; }
    .ms-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: background var(--transition);
    }
    .ms-option:hover { background: var(--primary-light); }
    .ms-option input[type="checkbox"] { margin: 0; cursor: pointer; }

    /* 通道分组 */
    .group-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .group-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      background: #FAFCFF;
    }
    .group-name-input {
      flex: 1;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
    }
    .group-name-input:focus-visible { outline: none; border-color: var(--primary); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-blue { background: var(--primary-light); color: var(--primary); }
    .badge-orange { background: #FFF7ED; color: #D97706; }
    .badge-green { background: #F0FDF4; color: #16A34A; }
    .group-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .section-note {
      padding: 8px 10px;
      background: #F8FAFC;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .section-note.warn { background: #FFF7ED; border-color: #FDE68A; color: #92400E; }

    /* 机柜映射 */
    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-hint);
      font-size: 12px;
      line-height: 1.8;
    }
    .empty-state .empty-icon { font-size: 28px; margin-bottom: 6px; }

    /* 分隔标题 */
    .panel-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    /* 换热关系容器，供联动控制 */
    #sectionHeatExchange { transition: opacity .2s; }

    .action-link {
      font-size: 12px;
      cursor: pointer;
      color: var(--primary);
      transition: opacity .2s;
    }
    .action-link:hover { opacity: .75; }

    .page-header-right { display: flex; align-items: center; gap: 12px; }
    .auto-config-heading { gap: 8px; margin-top: 24px; }
    .auto-config-heading .panel-title { margin-bottom: 0; flex: 1; }
    .auto-config-heading .panel-title::before { flex-shrink: 0; }
    .auto-config-heading .btn { padding: 6px 10px; white-space: nowrap; }
    .multi-select-wrap.is-auto .multi-select-trigger { border-style: dashed; border-color: var(--secondary); }
    .auto-relation-badge { font-size: 10px; color: var(--text-secondary); white-space: nowrap; }
    #modalAutoConfig .modal-dialog { max-width: 720px; max-height: 90vh; display: flex; flex-direction: column; }
    #modalAutoConfig .modal-body { overflow-y: auto; line-height: 1.7; }
    #modalAutoConfigConfirm:disabled { opacity: .5; cursor: not-allowed; }
    .auto-config-rules p + p { margin-top: 8px; }
    .auto-config-count { box-sizing: content-box; width: 3ch; padding: 2px 4px; border: 1px solid var(--border-light); border-radius: 4px; font: inherit; text-align: center; appearance: textfield; }
    .auto-config-count::-webkit-inner-spin-button, .auto-config-count::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .auto-config-count[aria-invalid="true"] { border-color: #DC2626; color: #DC2626; background: #FEF2F2; }
    .auto-config-modes { border: 0; margin: 20px 0; }
    .auto-config-modes legend { font-weight: 600; margin-bottom: 8px; }
    .auto-config-modes label { display: inline-flex; align-items: center; gap: 6px; margin-right: 20px; }
    .auto-config-preview { padding: 12px; background: var(--bg-body); border: 1px solid var(--border-light); border-radius: var(--radius); }
    .auto-config-preview p + p { margin-top: 6px; }
    #autoConfigSkipped { max-height: 120px; overflow-y: auto; padding-left: 22px; font-size: 12px; color: var(--text-secondary); }
    .relation-toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 1200; padding: 12px 20px; border-radius: var(--radius); background: var(--text-primary); color: #fff; box-shadow: var(--shadow-card); max-width: calc(100vw - 32px); }
  
    html,body { height:100%; } .layout { height:100vh; min-height:0; } .main { scroll-behavior:smooth; }
    button,input,select { font-family:inherit; } button { cursor:pointer; } button:disabled { cursor:not-allowed; opacity:.55; }
    button:focus-visible,[tabindex]:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
    .page-header { gap:16px; flex-wrap:wrap; } .page-sub { margin-top:6px; font-size:12px; color:var(--text-secondary); }
    .content-body { align-items:flex-start; } .content-left { gap:16px; flex:1 1 650px; }
    .content-right { width:42%; min-width:370px; position:sticky; top:16px; max-height:calc(100vh - 110px); overflow-y:auto; }
    .panel-card { height:auto; min-width:0; } .panel-title-bar .panel-title { margin:0; }
    .panel-title-bar { gap:12px; } .section-block + .section-block { margin-top:22px; }
    .section-block { scroll-margin-top:20px; } .section-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:10px 0; font-weight:600; font-size:13px; }
    .btn.btn-sm { padding:5px 10px; font-size:12px; } .action-link { border:0; background:none; } .action-link.delete { color:var(--danger); }
    .data-table { table-layout:fixed; } .data-table td { vertical-align:top; } .data-table th { background:#F8FAFC; }
    .group-name-input { width:100%; min-width:80px; padding:7px 8px; } .name-cell { width:34%; }
    .auto-mark { display:inline-block; font-size:10px; color:var(--secondary); margin-top:4px; }
    tr.is-auto > td { border-top:1px dashed #93B4ED; border-bottom:1px dashed #93B4ED; }
    tr.is-selected > td { background:var(--primary-light); } .row-actions { display:flex; gap:8px; margin-top:5px; flex-wrap:wrap; }
    .ms-tag { font-size:11px; line-height:1.6; } .multi-select-trigger { min-width:0; }
    #multiPicker { position:fixed; top:0; left:0; right:auto; width:320px; max-height:300px; z-index:1100; }
    .ms-option.is-disabled { color:var(--text-hint); cursor:not-allowed; } .ms-option small { margin-left:auto; max-width:145px; }
    .picker-head { display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:#fff; padding:8px 10px; border-bottom:1px solid var(--border-light); font-size:12px; }
    .prop-row td { background:#FAFCFF; padding:10px 12px; } .prop-panel { border:1px dashed var(--border); border-radius:var(--radius); background:#fff; padding:12px; }
    .prop-panel-head { font-size:12px; color:var(--text-secondary); margin-bottom:12px; }
    .prop-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .prop-item { min-width:0; } .prop-label { display:flex; flex-wrap:wrap; align-items:center; gap:4px; font-size:12px; font-weight:600; margin-bottom:5px; }
    .prop-value { display:flex; align-items:center; gap:5px; } .prop-unit { font-size:11px; white-space:nowrap; color:var(--text-secondary); }
    .prop-value .field-control,.prop-value .field-select { min-width:0; padding:6px 8px; }
    .prop-item.is-missing .field-control,.prop-item.is-missing .field-select,.prop-item.is-invalid .field-control,.prop-item.is-invalid .field-select { border-color:var(--danger); background:#FEF2F2; }
    .prop-item.is-edited:not(.is-missing):not(.is-invalid) .field-control { border-color:var(--secondary); background:#F5F9FF; }
    .edit-tag { font-size:10px; color:var(--primary); background:var(--primary-light); padding:0 4px; display:none; }
    .is-edited .edit-tag { display:inline; } .prop-err { font-size:11px; color:var(--danger); margin-top:4px; min-height:0; }
    .field-control[readonly] { background:#F1F5F9; color:var(--text-secondary); }

<script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), copy=v=>v==null?v:JSON.parse(JSON.stringify(v));
const params=new URLSearchParams(location.search), Store=window.ColdStationStore, readonly=params.get('mode')==='view';
const systemId=params.get('id')||Store.pendingDraft()?.id||Store.nextId(), configId=systemId;
const back=Store.safeBack(params.get('back'));
const draft=(!readonly&&params.get('resume')==='1'?Store.getDraft(systemId):null)||Store.createDraft(systemId);
const isNewConfiguration=!Store.getEffective(systemId);
const preset=Store.getEffective(systemId)||draft, info=draft;
const unitCount=Number(draft.units)||6, air=draft.systemType==='air';
const includes=draft.includes||[], has=x=>includes.includes(x), name=draft.name||'新建冷水系统';
const baseSnapshot=draft.baseSnapshot===undefined?Store.getEffective(systemId):copy(draft.baseSnapshot);
let savedResult=null, pendingSave=null;

const groupTypes=[{key:'unit',label:'制冷单元',device:['ch','hx']},{key:'freeze',label:'并联冷冻水泵管路',device:['fp']},...(!air?[{key:'cool',label:'并联冷却水泵管路',device:['cp']},{key:'tower',label:'并联冷却塔管路',device:['ct']}]:[]),...(has('二次泵')?[{key:'second',label:'并联二次泵管路',device:['sp']}]:[]),...(has('蓄冷罐')?[{key:'tank',label:'蓄冷罐组',device:['tk']}]:[])];
const attrDefs=Store.groupDefs();
const kindNames={ch:air?'风冷冷水机组':'冷水主机',hx:'板换',fp:'冷冻水泵',cp:'冷却水泵',ct:'冷却塔',sp:'二次泵',tk:'蓄冷罐'};
const allDevices=Array.isArray(draft.devices)?draft.devices:isNewConfiguration?[]:Store.deviceGroups(draft).flatMap(g=>Array.from({length:g.key==='TK'?(systemId==='C'?3:2):unitCount},(_,i)=>Store.makeDevice(draft,g,i+1)));
let devices=allDevices.filter(d=>groupTypes.some(t=>t.device.includes(d.kind)));

const deviceById=id=>devices.find(d=>d.id===id), typeByKey=k=>groupTypes.find(t=>t.key===k), list=k=>state.groups.filter(g=>g.type===k), group=id=>state.groups.find(g=>g.id===id);
function defaults(type){ return Object.fromEntries((attrDefs[type]||[]).filter(d=>!d.readonly).map(d=>[d.key,d.value])); }
function initialTopology(){if(draft.topology)return draft.topology;if(isNewConfiguration||!devices.length)return {groups:[],relations:[]};try{return Store.createTopology({...draft,devices});}catch{return {groups:[],relations:[]};}}
let sequence=100, state=copy(initialTopology());
function newGroup(type,number,members,automatic=false){return {id:type+'-'+number,name:typeByKey(type).label+' '+number,type,slot:String(number),members,attrs:defaults(type),originalAttrs:defaults(type),auto:automatic};}
state.groups=state.groups.filter(g=>typeByKey(g.type)).map(g=>({...g,members:g.members.filter(id=>deviceById(id)),attrs:g.attrs||defaults(g.type),originalAttrs:copy(g.attrs||defaults(g.type))}));

const relDefs=[{key:'freeze',label:'冷冻侧供水',from:'freeze',to:'unit'},...(!air?[{key:'cool',label:'冷却侧供水',from:'unit',to:'cool'},{key:'tower',label:'冷却塔供水',from:'cool',to:'tower'}]:[]),...(has('二次泵')?[{key:'second',label:'二次侧供水',from:'second',to:'freeze',readonly:true}]:[])];
state.relations=(state.relations||[]).filter(r=>group(r.from)&&relDefs.some(d=>d.key===r.key)).map(r=>({...r,to:r.to.filter(id=>group(id))}));
// groupAttributes 是同一分组的表格表示；拓扑内分组为主，导入同时写入两者。
for(const saved of draft.groupAttributes||[]){const g=state.groups.find(g=>g.id===saved.id);if(g&&!g.attrs)g.attrs=copy(saved.attrs);}
let selected='',scene='normal',expanded=new Set(),picker=null,confirmAction=null,modalReturn=null,autoConfig=null,manualMatches={},lastPlan=null,saving=false,failedFrom=null;

function anno(type,module,items,source='需求文档 ·《冷站配置需求文档》§4.4'){
 const tags={field:'字段说明',data:'数据逻辑',ux:'交互说明',edge:'边界与异常',state:'状态说明'};
 return `<div class="anno anno-${type}" data-version="v3.0"><span class="anno-tag">${tags[type]}</span><span class="anno-version">v3.0</span><span class="anno-source">${source}</span><div class="anno-body"><p><b>关联模块：</b>${module}</p><ul>${items.map(s=>`<li>${s}</li>`).join('')}</ul></div></div>`;
}
$('demoAnno').innerHTML=anno('ux','原型演示',['仅用于评审，切换完成后的正常、冲突和写入失败结果。','切换不改表格内容；正常结果可演示重新同步或稍后处理。','所有操作使用本页演示数据，不提交真实系统。'],'产品推断');
$('groupsAnno').innerHTML=anno('field','分组配置',['分组名可修改；成员仅选步骤 2 已关联的同类设备。','每台设备只在一个分组；其他分组已占用的设备置灰并标所在分组。','可新增分组；移除成员或删除分组先检查引用，通过后确认并清理连线。']);
$('groupsAnno').innerHTML+=anno('field','分组名与草稿',['分组名须非空、同类分组内不重名，最多 50 字；格式不符时定位并提示。','修改先保留为草稿；单独进入时有草稿须先选择恢复或丢弃。','新建配置的分组与供水关系初始为空，可按步骤 2 已关联的设备一键生成。'],'产品推断');
$('relationsAnno').innerHTML=anno('field','供水关系',['每个起点一行，终点多选；支持一对一、母管制和混合连接。','只配置连接，不填写权重或比例；移除连线前检查引用。','二次侧只读显示自动生成；每个二次泵管路连接全部冷冻水泵管路。']);
$('topologyAnno').innerHTML=anno('data','系统拓扑',['按冷冻水泵管路、制冷单元、冷却水泵管路、冷却塔管路从左到右显示。','二次泵管路位于冷冻侧外侧；表格修改后实时更新图和统计。','点选分组高亮它的直接连线；蓄冷罐组在图底部单独展示。']);
$('saveAnno').innerHTML=anno('ux','完成、上一步与取消',['完成只做格式校验；必填未填和连接不完整不拦保存，保存后到配置校验检查。','只提交本次修改项；逐项处理并发冲突后再次提交。','任一项写入失败时保持保存前配置，保留本页内容并定位失败行。','新建保存后提示配置校验及创建设备预测模型；编辑时仅列出受本次变更影响的模型。','上一步保留草稿；取消确认后清理草稿，返回来源页或列表。'],'需求文档 ·《冷站配置需求文档》§4.5、§4.6');
$('pageTitle').textContent=readonly?'查看冷站配置':params.get('mode')==='edit'?'编辑冷站配置':'新建冷站配置'; $('systemSummary').textContent=name+' · '+(air?'风冷':'水冷')+' · 系统拓扑';
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3400);}
function snapshot(){return {...copy(draft),id:systemId,name,systemName:name,systemType:air?'air':'water',type:air?'air':'water',includes:copy(includes),systemIncludes:copy(includes),units:state.groups.filter(g=>g.type==='unit').length,devices:allDevices.map(d=>copy(devices.find(x=>x.id===d.id)||d)),groupAttributes:groupAttributeRows(),topology:copy({...state,systemId})};}
function persist(){if(!readonly)Store.setDraft(snapshot());return true;}

function groupAttributeRows(){return state.groups.filter(g=>attrDefs[g.type]).map(g=>({id:g.id,name:g.name,model:{tower:'并联冷却塔管路',second:'并联二次泵管路',tank:'蓄冷罐设备组'}[g.type],attrs:Object.fromEntries(attrDefs[g.type].map(d=>[d.key,computed(g,d.key)]))}));}
function touch(){if(readonly)return;persist();drawTopology();}
function relation(r,from){return state.relations.find(x=>x.key===r.key&&x.from===from)||{key:r.key,from,to:[],auto:false};}
function getRelation(key,from){return relation(relDefs.find(r=>r.key===key),from);}
function computed(g,key){
 const volume=g.members.reduce((s,id)=>{const d=deviceById(id);return s+(d&&!d.output?(Number(d.capacity)||0):0);},0);
 if(key==='volume')return volume.toFixed(1);
 if(key==='design_cool_capacity'){const factor=g.attrs.safe_factor,delta=g.attrs.design_temp_diff;return factor!==''&&delta!==''&&Number.isFinite(Number(factor))&&Number.isFinite(Number(delta))?(volume*Number(delta)*1.163*Number(factor)).toFixed(1):'';}
 return g.attrs[key]??'';
}
function valueError(d,v){if(v==='')return '';if(d.options)return d.options.includes(v)?'':'请选择有效选项';return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(String(v))&&Number.isFinite(Number(v))?'':'请输入数字';}
function attrAnnotation(g){
 let items;
 if(g.type==='tower')items=['最大冷却水温差：数值，单位 ℃，必填。','冷却塔组额定压降：数值，单位 bar，必填。','空值标红但允许保存；非数值拦保存，改过的格标记已修改。'];
 if(g.type==='second')items=['最大旁通流量、最小旁通流量：数值，单位 m³/h，均非必填，留空不限制。','二次泵组额定压降：数值，单位 bar，必填。','格式校验、缺失标红和修改标记同设备属性格；分组属性参加步骤 2 的属性表导入导出。'];
 if(g.type==='tank')items=['连接方式选串联式或并联式；安全系数默认 0.83。','最低安全放冷时长单位 min；设计温差单位 ℃；以上四项必填。','容积只读，为组内投入的蓄冷罐容量之和。','设计蓄冷量只读，为设计温差 × 容积 × 1.163 × 安全系数，单位 kWh。','四项可填属性按步骤 2 属性格规则校验并标记修改，空值不拦保存。'];
 return anno('field',g.name+' · 分组属性',items,'需求文档 ·《冷站配置需求文档》§4.3、§4.4、附录 A；标准物模型静态数据');
}
function attrPanel(g){return `<tr class="prop-row" id="attrs-${g.id}" ${expanded.has(g.id)?'':'hidden'}><td colspan="3">${attrAnnotation(g)}<div class="prop-panel"><div class="prop-panel-head" id="summary-${g.id}">${attrSummary(g)}</div><div class="prop-grid">${attrDefs[g.type].map(d=>{
const v=computed(g,d.key),invalid=valueError(d,v),missing=d.required&&v==='',edited=!d.readonly&&v!==g.originalAttrs[d.key];
return `<div class="prop-item ${missing?'is-missing':''} ${invalid?'is-invalid':''} ${edited?'is-edited':''}" id="cell-${g.id}-${d.key}"><label class="prop-label" for="attr-${g.id}-${d.key}">${d.name}${d.required?'<span class="required">*</span>':''}${d.readonly?'<span class="muted">自动计算</span>':''}<span class="edit-tag">已修改</span></label><div class="prop-value">${d.options?`<select class="field-select" id="attr-${g.id}-${d.key}" data-attr="${d.key}" data-group="${g.id}"><option value="">请选择</option>${d.options.map(vv=>`<option ${v===vv?'selected':''}>${vv}</option>`).join('')}</select>`:`<input class="field-control" type="text" inputmode="decimal" id="attr-${g.id}-${d.key}" data-attr="${d.key}" data-group="${g.id}" value="${esc(v)}" ${d.readonly?'readonly':''} placeholder="${d.required?'请输入':'不限制'}" aria-invalid="${!!invalid}">`}${d.unit?`<span class="prop-unit">${d.unit}</span>`:''}</div><div class="prop-err">${invalid}</div></div>`;
}).join('')}</div></div></td></tr>`;}
function attrSummary(g){const defs=attrDefs[g.type],miss=defs.filter(d=>d.required&&computed(g,d.key)==='').length,edit=defs.filter(d=>!d.readonly&&computed(g,d.key)!==g.originalAttrs[d.key]).length;return `${defs.length} 项属性 · ${miss} 项未填 · 已修改 ${edit} 项`;}
function multiTrigger(mode,id,values,locked=false,key=''){
 locked=locked||readonly;
 const names=values.map(v=>mode==='member'?deviceById(v)?.name:group(v)?.name).filter(Boolean);
 return `<div class="multi-select-wrap"><div class="multi-select-trigger" id="trigger-${mode}-${id}-${key}" ${locked?'':`role="button" tabindex="0" data-action="picker" data-mode="${mode}" data-id="${id}" data-key="${key}"`} aria-label="${mode==='member'?'选择成员':'选择供水对象'}">${names.length?values.map(v=>{const label=mode==='member'?deviceById(v)?.name:group(v)?.name;if(!label)return '';return `<span class="ms-tag">${esc(label)}${!locked?`<button class="ms-tag-remove" aria-label="移除${esc(label)}" data-action="remove-${mode}" data-id="${id}" data-value="${v}" data-key="${key}">×</button>`:''}</span>`;}).join(''):`<span class="ms-placeholder">${locked?'暂无可连接的管路':'请选择'}</span>`}${locked?'':'<span class="ms-placeholder" style="margin-left:auto">⌄</span>'}</div></div>`;

 for(const c of candidate.groups){let existing=result.groups.find(g=>g.type===c.type&&g.members.some(id=>c.members.includes(id)))||result.groups.find(g=>g.type===c.type&&!g.members.length&&g.slot===c.slot);
 if(existing){idMap[c.id]=existing.id;if(existing.members.length===0){const members=c.members.filter(id=>!occupied.has(id));if(members.length){existing.members=members;members.forEach(id=>occupied.add(id));existing.auto=true;newGroups++;}}}
 else {const members=c.members.filter(id=>!occupied.has(id));if(!members.length)continue;const added=copy(c);while(result.groups.some(g=>g.id===added.id))added.id=added.type+'-'+(++sequence);added.members=members;result.groups.push(added);members.forEach(id=>occupied.add(id));idMap[c.id]=added.id;newGroups++;}}
 for(const rel of candidate.relations){const from=idMap[rel.from];if(!from)continue;const to=rel.to.map(id=>idMap[id]).filter(Boolean),existing=result.relations.find(r=>r.key===rel.key&&r.from===from);if(existing?.to.length)continue;if(existing){existing.to=to;existing.auto=true;}else result.relations.push({...rel,from,to,auto:true});newRelations+=to.length;}
 // 二次侧为派生关系，只计本轮新增的边。
 newRelations+=Math.max(0,derivedCount(result)-derivedCount(state));return {result,newGroups,newRelations,changes:newGroups+newRelations};
}
function derivedCount(s){return s.groups.filter(g=>g.type==='second').length*s.groups.filter(g=>g.type==='freeze').length;}
function countEdges(s){return s.relations.reduce((n,r)=>n+r.to.length,0)+derivedCount(s);}
function updateGeneratePreview(matches=resolveMatches()){
 const candidate=buildGenerated(matches),plan=mergeGenerated(candidate),pending=matches.filter(m=>!m.dest);lastPlan={...plan,pending,candidate};
 $('pendingList').textContent=pending.length?'待匹配：'+pending.map(m=>m.device.name+'（'+m.reason+'）').join('、'):'全部设备已匹配';
 $('generatePreview').innerHTML=`将生成 <strong>${plan.newGroups}</strong> 个分组、<strong>${plan.newRelations}</strong> 条关系，<strong>${pending.length}</strong> 台待匹配${autoConfig.mode==='fill'?'<p class="muted">保留已有非空分组及关系</p>':'<p class="danger-text">将替换现有分组与关系，确认后请逐条核对</p>'}`;
 $('generatorError').textContent='';
}
function generationBlocked(result){
 if(!isReferenced('freeze-1'))return false;const old=group('freeze-1'),next=result.groups.find(g=>g.id==='freeze-1');
 return old&&(!next||JSON.stringify([...old.members].sort())!==JSON.stringify([...next.members].sort())||state.relations.some(r=>(r.from===old.id||r.to.includes(old.id))&&r.to.some(to=>!result.relations.some(n=>n.key===r.key&&n.from===r.from&&n.to.includes(to)))));
}
function applyGeneration(){
 if(!lastPlan)return;
 if(generationBlocked(lastPlan.result)){$('generatorError').innerHTML='无法覆盖：并联冷冻水泵管路 1 被安全边界「A路冷站安全边界」引用。请保留该分组及成员、连线。';return;}
 if(lastPlan.changes===0){toast('当前分组与关系均已配置，无需补空');return;}
 const plan=lastPlan;
 const apply=()=>{state=copy(plan.result);expanded=new Set();selected='';closeModal();render();touch();toast(`已生成 ${plan.newGroups} 个分组、${plan.newRelations} 条关系${plan.pending.length?'；待匹配设备保留待处理':''}`);};
 if(autoConfig.mode==='overwrite'){openModal('确认覆盖已有配置',anno('ux','覆盖确认弹窗；入口：一键生成选择覆盖后确认',['确认前检查受引用的分组和连线；仍被引用的对象不可移除或替换成员。','确认后用预览结果替换本页分组和关系，标为自动。','取消保留原有配置；页面草稿随上一步保留。'],'需求文档 ·《冷站配置需求文档》§4.4、§4.6')+`<p>将生成 ${plan.newGroups} 个分组、${plan.newRelations} 条关系，替换当前分组与关系，确定继续吗？</p>`,'<button class="btn" data-action="close-modal">取消</button><button class="btn btn-primary" data-action="confirm-removal">确认覆盖</button>');confirmAction=apply;}
 else apply();
}
function changesSinceOpen(){return Store.diff(baseSnapshot,snapshot());}
function valueAt(snapshot,path){let value=snapshot;for(const key of path){value=Array.isArray(value)?value.find(x=>(x.id||x.key+'|'+x.from)===key):value?.[key];}return copy(value);}
function conflictValue(change){
 const v=change.value;if(v==null)return copy(change.before);
 if(Array.isArray(v))return copy(change.before||[]);
 if(typeof v==='object')return change.before?copy(change.before):{...copy(v),...(v.to?{to:[]}:{name:String(v.name||change.object||'对象').slice(0,42)+'（已更新）'})};
 const device=allDevices.find(d=>d.id===change.deviceId),model=device?.model||(change.kind==='系统属性'?'水冷冷水系统':null);
 const definition=(model?Store.DEFS[model]:Object.values(Store.DEFS).flat())?.find(p=>p.id===change.attribute);
 if(definition?.options)return definition.options.find(o=>o[0]!==String(v))?.[0]||v;
 if(typeof v==='string'&&v.trim()!==''&&Number.isFinite(Number(v))){const n=Number(v),next=n+1;return String(definition?.max!==undefined&&next>definition.max?n-1:next);}
 return String(v).slice(0,42)+'（他人修改）';
}
function save(){if(readonly||saving||!formatCheck())return;closePicker();$('saveError').hidden=true;failedFrom=null;renderRelations();const page=snapshot(),changes=changesSinceOpen(),current=Store.getEffective(systemId),external=Store.diff(baseSnapshot,current||page);
 const intersects=(a,b)=>a.every((x,i)=>x===b[i])||b.every((x,i)=>x===a[i]);
 const conflicts=current&&current.rev!==(draft.baseRev||0)?changes.filter(c=>external.some(e=>intersects(c.path,e.path))):[];
 pendingSave={page,changes,current,conflicts:conflicts.map(c=>({change:c,current:valueAt(current,c.path)}))};
 if(scene==='conflict'&&changes.length&&!conflicts.length)pendingSave.conflicts=changes.map(c=>({change:c,current:conflictValue(c),demo:true}));
 if(pendingSave.conflicts.length){showConflicts();return;}if(scene==='fail'){showSaveFailure();return;}saveSuccess();
}
function displayValue(value,change){if(value==null)return '未配置';if(change?.attribute==='InputOrOutput')return String(value)==='1'?'投出':'投入';if(Array.isArray(value))return value.map(v=>group(v)?.name||deviceById(v)?.name||v).join('、')||'未配置';if(typeof value==='object'){if(value.to)return value.to.map(id=>group(id)?.name||id).join('、')||'未连接';return value.name||'配置内容';}return String(value);}
function showConflicts(){openModal('配置已被他人修改',anno('field','保存冲突弹窗；入口：完成时存在冲突',['仅列出本次实际修改且发生冲突的内容。','每项选择当前值或本页值，全部选择后可再次提交。','未修改的内容沿用最新已保存配置，取消保留草稿。'],'需求文档 ·《冷站配置需求文档》§4.5')+'<p>请选择每一项保留的值，再次提交。</p>'+pendingSave.conflicts.map((c,i)=>`<section class="conflict-card"><h3>${esc(c.change.object)} · ${esc(c.change.label||c.change.kind)}</h3><div><label><input type="radio" name="conflict${i}" data-conflict="${i}" value="current">保留当前值：${esc(displayValue(c.current,c.change))}</label></div><div><label><input type="radio" name="conflict${i}" data-conflict="${i}" value="page">保留本页值：${esc(displayValue(c.change.value,c.change))}</label></div></section>`).join(''),'<button class="btn" data-action="close-modal">返回修改</button><button class="btn btn-primary" id="resubmit" data-action="resubmit" disabled>再次提交</button>');}
function resubmit(){if(!pendingSave||readonly)return;for(let i=0;i<pendingSave.conflicts.length;i++){const selected=document.querySelector(`[name="conflict${i}"]:checked`);if(!selected)return;const c=pendingSave.conflicts[i];if(selected.value==='current')c.change.value=copy(c.current);}
 pendingSave.page=baseSnapshot?Store.applyChanges(baseSnapshot,pendingSave.changes):Store.applyChanges(snapshot(),pendingSave.changes);if(scene==='fail'){showSaveFailure();return;}saveSuccess();
}
function showSaveFailure(){const c=pendingSave?.changes[0];$('saveError').textContent='保存失败：'+(c?c.object+' · '+(c.label||c.kind):'冷站配置')+'写入失败，已保存配置保持不变，修改内容已保留';$('saveError').hidden=false;persist();let el;if(c?.kind==='供水关系'){failedFrom=c.value.key+'-'+c.value.from;renderRelations();el=$('rel-'+failedFrom);}else if(c?.groupId){expanded.add(c.groupId);renderGroups();el=$('group-'+c.groupId);}else el=$('saveError');el?.scrollIntoView({block:'center',behavior:'smooth'});el?.setAttribute('tabindex','-1');el?.focus({preventScroll:true});}
function saveSuccess(){if(readonly||!pendingSave)return;saving=true;const current=Store.getEffective(systemId),changed=pendingSave.changes;
 const merged=current?Store.applyChanges(current,changed):pendingSave.page;const applied=Store.diff(current||baseSnapshot,merged),models=isNewConfiguration?[]:Store.affectedModels(current||baseSnapshot,merged,applied);
 merged.changedItems=applied;merged.affectedModels=models;merged.validationStale=true;merged.modelSyncRequested=false;merged.modelSyncStatus=models.length?'待同步':'无受影响模型';
 savedResult=Store.saveConfig(merged);Store.clearDraft();
 openModal('已保存',anno('ux','保存成功弹窗；入口：完成或冲突后再次提交',['所有修改保存成功后统一生效，旧校验结果失效。','新建配置提示到设备预测模型创建模型；编辑时仅列出受本次变更影响的模型。','有受影响模型时可请求重新同步，不自动重训。','完成后返回来源页并重新校验；无来源页时回列表。'],'需求文档 ·《冷站配置需求文档》§4.5')+`<p><span class="success-icon">✓</span> 已保存，建议执行配置校验</p>${models.length?`<p class="summary-text">以下模型受本次配置变更影响：</p><ul class="model-list">${models.map(m=>`<li>${esc(m.name)}</li>`).join('')}</ul>`:isNewConfiguration?'<p>可到设备预测模型为这些设备创建模型。</p><a class="action-link" href="机理模型训练.html">前往设备预测模型 →</a>':'<p>本次修改没有涉及设备预测模型。</p>'}`,`<button class="btn" data-action="save-later">${models.length?'稍后':'返回'}</button>${models.length?'<button class="btn btn-primary" data-action="save-sync">一键重新同步</button>':''}`);saving=false;
}
function leaveSuccess(sync){if(!savedResult)return;Store.markModelSync(systemId,!!sync);if(back){const q=new URL(back,location.href);q.searchParams.set('revalidate','1');location.href=q.pathname.split('/').at(-1)+'?'+q.searchParams+q.hash;}else location.href='冷站配置-列表.html?saved=1&id='+encodeURIComponent(systemId);}

document.addEventListener('click',event=>{
 const el=event.target.closest('[data-action]');if(!el){if(picker&&!event.target.closest('#multiPicker'))closePicker();return;}
 const a=el.dataset.action;event.preventDefault();
 if(readonly&&!['annotations','step','cancel','expand','select-group','clear-selection','close-modal','reference'].includes(a))return;
 if(a==='annotations'){document.body.classList.toggle('annotation-mode');initAnnoVersionFilter();return;}
 if(a==='scene'){scene=el.dataset.scene;document.querySelectorAll('[data-scene]').forEach(b=>{b.classList.toggle('is-active',b===el);b.setAttribute('aria-pressed',b===el?'true':'false');});$('saveError').hidden=true;failedFrom=null;renderRelations();toast('保存演示：'+el.textContent);return;}
 if(a==='generate')return openGenerator();if(a==='close-modal')return closeModal();if(a==='close-picker')return closePicker();
 if(a==='step')return goStep(el.dataset.step);if(a==='cancel')return showCancel();if(a==='cancel-confirm'){Store.clearDraft();closeModal();location.href=back||'冷站配置-列表.html';return;}
 if(a==='add-group'){const type=el.dataset.type,num=Math.max(0,...list(type).map(g=>Number(g.slot)||0))+1,g=newGroup(type,num,[]);while(group(g.id))g.id=type+'-'+(++sequence);state.groups.push(g);render();touch();$('group-'+g.id)?.scrollIntoView({block:'center'});document.querySelector(`[data-name="${g.id}"]`)?.focus();return;}
 if(a==='delete-group'){const id=el.dataset.id;return confirmRemoval(id,()=>{state.groups=state.groups.filter(g=>g.id!==id);state.relations=state.relations.filter(r=>r.from!==id).map(r=>({...r,to:r.to.filter(x=>x!==id)}));if(selected===id)selected='';},`删除「${group(id).name}」并清理它的供水关系？`);}
 if(a==='expand'){const id=el.dataset.id;expanded.has(id)?expanded.delete(id):expanded.add(id);renderGroups();lockView();initAnnoVersionFilter();return;}
 if(a==='select-group'){selected=el.dataset.id;document.querySelectorAll('#groupsContainer tr').forEach(r=>r.classList.toggle('is-selected',r.id==='group-'+selected));drawTopology();return;}
 if(a==='clear-selection'){selected='';renderGroups();drawTopology();return;}
 if(a==='picker')return openPicker(el.dataset.mode,el.dataset.id,el.dataset.key||'');
 if(a==='remove-member')return removeMember(el.dataset.id,el.dataset.value);
 if(a==='remove-relation')return removeRelation(el.dataset.key,el.dataset.id,el.dataset.value);
 if(a==='confirm-removal')return confirmAction?.();if(a==='apply-generate')return applyGeneration();if(a==='save')return save();if(a==='resubmit')return resubmit();
 if(a==='reference'){toast('打开安全边界 › A路冷站安全边界 › 冷冻水泵数量与边界');return;}
 if(a==='save-sync')return leaveSuccess(true);if(a==='save-later')return leaveSuccess(false);
});
document.addEventListener('input',event=>{if(readonly)return;const el=event.target;
 if(el.dataset.attr)return updateAttr(el);
 if(el.dataset.name){const g=group(el.dataset.name);g.name=el.value;g.auto=false;el.classList.remove('is-invalid');el.closest('tr').classList.remove('is-auto');el.closest('td').querySelector('.auto-mark')?.remove();touch();}
});
document.addEventListener('change',event=>{if(readonly)return;const el=event.target;
 if(el.dataset.name){render();return;}
 if(el.dataset.attr){updateAttr(el);return;}
 if(el.dataset.gen){autoConfig[el.dataset.gen]=el.value;paintMatching();return;}
 if(el.name==='generateMode'){autoConfig.mode=el.value;updateGeneratePreview();return;}
 if(el.dataset.match){manualMatches[el.dataset.match]=el.value;paintMatching();return;}
 if(el.dataset.conflict!==undefined){$('resubmit').disabled=!pendingSave.conflicts.every((c,i)=>document.querySelector('[name="conflict'+i+'"]:checked'));return;}
 if(el.dataset.pickerValue&&picker){const {mode,id,key}=picker,value=el.dataset.pickerValue,g=group(id);
 if(!el.checked){mode==='member'?removeMember(id,value):removeRelation(key,id,value);return;}
 if(mode==='member'){if(state.groups.some(o=>o.id!==id&&o.members.includes(value)))return;g.members.push(value);g.auto=false;}
 else{let r=getRelation(key,id);if(!state.relations.includes(r))state.relations.push(r);if(!r.to.includes(value))r.to.push(value);r.auto=false;}

 }

document.addEventListener('keydown',event=>{

render();
const target=params.get('group')||params.get('dev');
if(target){const g=group(target)||state.groups.find(g=>g.name.replace(/\s/g,'')===target.replace(/\s/g,''))||state.groups.find(g=>g.members.includes(target));if(g){selected=g.id;if(attrDefs[g.type])expanded.add(g.id);render();setTimeout(()=>{const attr=params.get('attr'),rel=params.get('rel'),el=(attr?$('cell-'+g.id+'-'+attr):null)||(rel?$('rel-'+rel+'-'+g.id):null)||$('group-'+g.id);if(el){el.classList.add('located');el.scrollIntoView({block:'center'});el.querySelector('input,select')?.focus();}},80);}else toast('未找到对应分组，请检查配置');}
if(back){const link=document.createElement('button');link.className='back-link';link.textContent=Store.backLabel(back);link.onclick=showCancel;document.querySelector('.page-header').append(link);}
const recovery=Store.getDraft(systemId);

 const main=$('mainContent'),bar=document.createElement('div');bar.className='banner';bar.innerHTML=anno('ux','未保存修改',['有同一配置的草稿时，先选择恢复或丢弃。','恢复沿用开始编辑时的保存版本，跨步骤不改变基线。','丢弃仅清理草稿，保留已保存的配置。'],'需求文档 ·《冷站配置需求文档》§4.5')+'有未保存的修改：<button class="btn" id="restoreDraft">恢复</button> <button class="btn" id="discardDraft">丢弃</button>';Array.from(main.children).forEach(el=>el.inert=true);main.prepend(bar);const reload=resume=>{const q=new URLSearchParams(location.search);q.set('resume',resume?'1':'0');location.replace(location.pathname+'?'+q);};$('restoreDraft').onclick=()=>reload(true);$('discardDraft').onclick=()=>{Store.clearDraft();reload(false);};
}
