<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冷站诊断规则</title>
  <style>
    :root {
      --primary: #1E40AF;
      --primary-dark: #17358A;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-hint: #94A3B8;
      --border: #D8E1EB;
      --border-light: #EAF0F6;
      --bg-body: #F6F8FB;
      --bg-card: #FFFFFF;
      --danger: #DC2626;
      --success: #16A34A;
      --blue-link: #1890FF;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --transition: .22s cubic-bezier(.4, 0, .2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-body);
      -webkit-font-smoothing: antialiased;
    }

    button { border: none; background: none; font: inherit; cursor: pointer; }
    input { font: inherit; }

    .layout { display: flex; flex-direction: column; min-height: 100vh; }
    .body-wrap { display: flex; flex: 1; min-height: 0; }
    .main { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg-body); }
    .page-shell { padding: 18px 20px 24px; }

    .page-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px 10px;
    }

    .page-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
    }

    .page-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px 16px;
    }

    .search-field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 12px;
      min-width: 260px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-secondary);
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .search-field:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.12);
    }

    .search-field svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      opacity: .75;
    }

    .search-input {
      border: none;
      outline: none;
      font-size: 12px;
      width: 100%;
      color: var(--text-primary);
    }

    .search-input::placeholder { color: var(--text-hint); }

    .table-wrap { overflow-x: auto; }

    .data-table {
      width: 100%;
      min-width: 1180px;
      border-collapse: collapse;
    }

    .data-table thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .data-table tbody td {
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }

    .data-table tbody tr:hover { background: #FBFCFE; }
    .data-table tbody tr.is-hidden { display: none; }

    .rule-text {
      max-width: 420px;
      white-space: normal;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      border-radius: 999px;
      background: #CBD5E1;
      transition: background var(--transition);
      cursor: pointer;
      flex-shrink: 0;
    }

    .switch.on { background: var(--primary); }

    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.18);
      transition: transform var(--transition);
    }

    .switch.on::after { transform: translateX(18px); }

    .action-link {
      font-size: 13px;
      color: var(--blue-link);
      white-space: nowrap;
    }

    .action-link:hover { opacity: 0.72; }

    .page-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
    }

    .pagination-total {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .pagination {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .page-item,
    .page-arrow {
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }

    .page-item.active {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    .empty-state {
      display: none;
      padding: 48px 18px;
      text-align: center;
      color: var(--text-hint);
      font-size: 13px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 240;
      padding: 24px;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: min(520px, 100%);
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 24px 48px rgba(15, 23, 42, 0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
    }

    .modal-title { font-size: 16px; font-weight: 700; }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 20px;
      line-height: 1;
    }

    .modal-close:hover { background: #F1F5F9; color: var(--text-primary); }

    .modal-body { padding: 16px 20px; }

    .modal .data-table { min-width: 0; }

    .modal .data-table tbody td,
    .modal .data-table thead th {
      white-space: nowrap;
    }

    .param-input {
      width: 120px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      color: var(--text-primary);
    }

    .param-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.12);
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 12px 20px 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 14px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      transition: all var(--transition);
    }

    .btn-ghost {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-secondary);
    }

    .btn-ghost:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-primary {
      color: #fff;
      background: var(--primary);
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      min-width: 180px;
      max-width: 320px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      font-size: 12px;
      line-height: 1.6;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.28);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: all .25s ease;
      z-index: 260;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="layout">
    <div id="app-header"></div>
    <div class="body-wrap">
      <div id="app-sidebar"></div>
      <main class="main">
        <div class="page-shell">
          <section class="page-card">
            <div class="page-head">
              <div class="page-title">诊断规则</div>
            </div>

            <div class="page-toolbar">
              <label class="search-field">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M6.5 1.5a5 5 0 1 0 3.1 8.9l3.5 3.5a1 1 0 0 0 1.4-1.4l-3.5-3.5a5 5 0 0 0-4.5-7.5zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
                </svg>
                <input class="search-input" id="searchInput" type="text" placeholder="请输入对象类型">
              </label>
            </div>

            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>序号</th>
                    <th>对象类型</th>
                    <th>诊断类型</th>
                    <th>诊断指标</th>
                    <th>诊断规则</th>
                    <th>诊断周期</th>
                    <th>启用</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="ruleTbody"></tbody>
              </table>
            </div>
            <div class="empty-state" id="emptyState">未找到匹配的诊断规则</div>

            <div class="page-foot">
              <div class="pagination-total" id="totalText">共 15 条</div>
              <div class="pagination">
                <span class="page-arrow">‹</span>
                <span class="page-item active">1</span>
                <span class="page-arrow">›</span>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="configModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-labelledby="configTitle">
      <div class="modal-head">
        <div class="modal-title" id="configTitle">规则配置</div>
        <button type="button" class="modal-close" id="configClose" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <table class="data-table">
          <thead>
            <tr>
              <th>参数</th>
              <th>值</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td id="paramName">负载率阈值</td>
              <td><input class="param-input" id="paramValue" type="number" value="100"></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="configCancel">取消</button>
        <button type="button" class="btn btn-primary" id="configConfirm">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      var RULES = [
        { objectType: '冷冻泵', diagnosisType: '电机过载诊断', indicator: '最大负载率', rule: '监测上 1/4 分位的功率与额定功率（属性）比值，即为最大负载率，＞100% 判定为过载。', period: '一小时', enabled: false, paramName: '负载率阈值', paramValue: '100' },
        { objectType: '冷冻泵', diagnosisType: '频率异常震荡诊断', indicator: '频率平均绝对偏差', rule: '统计 1 小时内开机状态下频率反馈值的平均绝对偏差，若＞5Hz 则判定为异常震荡。', period: '一小时', enabled: false, paramName: 'MAD 阈值(Hz)', paramValue: '5' },
        { objectType: '冷却塔', diagnosisType: '频繁启停诊断', indicator: '启停次数', rule: '统计 1 小时内启停次数（状态发生变化次数），＞2 次则判定为频繁启停。', period: '一小时', enabled: true, paramName: '启停次数阈值', paramValue: '2' },
        { objectType: '冷却塔', diagnosisType: '电机过载诊断', indicator: '最大负载率', rule: '监测上 1/4 分位的功率与额定功率（属性）比值，即为最大负载率，＞100% 判定为过载。', period: '一小时', enabled: false, paramName: '负载率阈值', paramValue: '100' },
        { objectType: '冷却泵', diagnosisType: '电机过载诊断', indicator: '最大负载率', rule: '监测上 1/4 分位的功率与额定功率（属性）比值，即为最大负载率，＞100% 判定为过载。', period: '一小时', enabled: false, paramName: '负载率阈值', paramValue: '100' },
        { objectType: '冷却泵', diagnosisType: '频率异常震荡诊断', indicator: '平均绝对偏差（MAD）', rule: '统计 1 小时内开机状态下频率反馈值的平均绝对偏差，若＞5Hz 则判定为异常震荡。', period: '一小时', enabled: true, paramName: 'MAD 阈值(Hz)', paramValue: '5' },
        { objectType: '冷水主机', diagnosisType: '频繁启停诊断', indicator: '启停次数', rule: '统计 1 小时内启停次数（状态发生变化次数），＞2 次则判定为频繁启停。', period: '一小时', enabled: false, paramName: '启停次数阈值', paramValue: '2' },
        { objectType: '冷水主机', diagnosisType: '冷凝器换热效率诊断', indicator: '冷凝器平均小温差', rule: '设备运行状态为 1 时，求冷凝器小温差平均值，若＞3℃ 则判定为换热效率低下。', period: '一小时', enabled: false, paramName: '小温差阈值(℃)', paramValue: '3' },
        { objectType: '冷水主机', diagnosisType: '压缩机过载诊断', indicator: '最大负载率', rule: '监测上 1/4 分位的功率与额定功率（属性）比值，即为最大负载率，＞100% 判定为过载。', period: '一小时', enabled: true, paramName: '负载率阈值', paramValue: '100' },
        { objectType: '冷水主机', diagnosisType: '蒸发器换热效率诊断', indicator: '蒸发器平均小温差', rule: '设备运行状态为 1 时，求蒸发器小温差平均值，若＞3℃ 则判定为换热效率低下。', period: '一小时', enabled: false, paramName: '小温差阈值(℃)', paramValue: '3' },
        { objectType: '并联冷却塔管路', diagnosisType: '冷却侧流量异常震荡诊断', indicator: '平均绝对偏差（MAD）', rule: '统计 1 小时内冷却水总流量值的平均绝对偏差，若＞100m³/h 则判定为异常震荡。', period: '一小时', enabled: false, paramName: '流量 MAD 阈值(m³/h)', paramValue: '100' },
        { objectType: '并联冷却塔管路', diagnosisType: '冷却水出塔温度异常震荡诊断', indicator: '平均绝对偏差（MAD）', rule: '统计 1 小时内冷却水出塔温度值的平均绝对偏差，若＞1℃ 则判定为异常震荡。', period: '一小时', enabled: false, paramName: '温度 MAD 阈值(℃)', paramValue: '1' },
        { objectType: '水冷冷水系统', diagnosisType: '热不平衡率诊断', indicator: '热不平衡率平均绝对值', rule: '统计 1 天内热不平衡率平均绝对值＞15%，则判定为异常。', period: '一天', enabled: false, paramName: '热不平衡率阈值(%)', paramValue: '15' },
        { objectType: '水冷冷水系统', diagnosisType: '冷冻侧流量异常震荡诊断', indicator: '平均绝对偏差（MAD）', rule: '统计 1 小时内冷冻水总流量值的平均绝对偏差，若＞100m³/h 则判定为异常震荡。', period: '一小时', enabled: false, paramName: '流量 MAD 阈值(m³/h)', paramValue: '100' },
        { objectType: '水冷冷水系统', diagnosisType: '冷冻水供水温度异常震荡诊断', indicator: '平均绝对偏差（MAD）', rule: '统计 1 小时内冷冻水供水温度值的平均绝对偏差，若＞1℃ 则判定为异常震荡。', period: '一小时', enabled: false, paramName: '温度 MAD 阈值(℃)', paramValue: '1' }
      ];

      var tbody = document.getElementById('ruleTbody');
      var emptyState = document.getElementById('emptyState');
      var totalText = document.getElementById('totalText');
      var searchInput = document.getElementById('searchInput');
      var configModal = document.getElementById('configModal');
      var paramName = document.getElementById('paramName');
      var paramValue = document.getElementById('paramValue');
      var toast = document.getElementById('toast');
      var toastTimer = null;
      var editingIndex = -1;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 1800);
      }

      function renderRows() {
        var keyword = searchInput.value.trim();
        var html = '';
        var visible = 0;

        RULES.forEach(function (row, index) {
          var show = !keyword || row.objectType.indexOf(keyword) !== -1;
          if (show) visible += 1;
          html +=
            '<tr class="' + (show ? '' : 'is-hidden') + '" data-index="' + index + '">' +
              '<td>' + (index + 1) + '</td>' +
              '<td>' + row.objectType + '</td>' +
              '<td>' + row.diagnosisType + '</td>' +
              '<td>' + row.indicator + '</td>' +
              '<td><div class="rule-text">' + row.rule + '</div></td>' +
              '<td>' + row.period + '</td>' +
              '<td><button type="button" class="switch' + (row.enabled ? ' on' : '') + '" data-action="toggle" aria-label="启用开关"></button></td>' +
              '<td><button type="button" class="action-link" data-action="config">规则配置</button></td>' +
            '</tr>';
        });

        tbody.innerHTML = html;
        emptyState.style.display = visible ? 'none' : 'block';
        totalText.textContent = '共 ' + visible + ' 条';
      }

      function openConfig(index) {
        var row = RULES[index];
        if (!row) return;
        editingIndex = index;
        paramName.textContent = row.paramName;
        paramValue.value = row.paramValue;
        configModal.classList.add('show');
        configModal.setAttribute('aria-hidden', 'false');
      }

      function closeConfig() {
        editingIndex = -1;
        configModal.classList.remove('show');
        configModal.setAttribute('aria-hidden', 'true');
      }

      tbody.addEventListener('click', function (event) {
        var target = event.target.closest('[data-action]');
        if (!target) return;
        var tr = target.closest('tr');
        var index = Number(tr.getAttribute('data-index'));
        var row = RULES[index];
        if (!row) return;

        if (target.getAttribute('data-action') === 'toggle') {
          row.enabled = !row.enabled;
          target.classList.toggle('on', row.enabled);
          showToast((row.enabled ? '已启用：' : '已停用：') + row.objectType + ' / ' + row.diagnosisType);
          return;
        }

        if (target.getAttribute('data-action') === 'config') {
          openConfig(index);
        }
      });

      searchInput.addEventListener('input', renderRows);
      document.getElementById('configClose').addEventListener('click', closeConfig);
      document.getElementById('configCancel').addEventListener('click', closeConfig);
      configModal.addEventListener('click', function (event) {
        if (event.target === configModal) closeConfig();
      });

      document.getElementById('configConfirm').addEventListener('click', function () {
        if (editingIndex < 0) return;
        RULES[editingIndex].paramValue = paramValue.value;
        showToast('已保存规则参数：' + RULES[editingIndex].paramName + ' = ' + paramValue.value);
        closeConfig();
      });

      renderRows();
    })();
  </script>
  <script src="components/nav.js" data-active-nav="AI智能能效" data-active-sidebar="冷站诊断规则"></script>
</body>
</html>
