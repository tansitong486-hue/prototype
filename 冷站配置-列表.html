<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>冷站配置 - AI 智控中枢</title><style>
    :root {
      --primary: #1E40AF;
      --primary-dark: #17358A;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-hint: #94A3B8;
      --border: #D8E1EB;
      --border-light: #EAF0F6;
      --bg-body: #F6F8FB;
      --bg-card: #FFFFFF;
      --sidebar-bg: #071B2E;
      --header-bg: #071B2E;
      --danger: #DC2626;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.04);
      --transition: .22s cubic-bezier(.4, 0, .2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-body);
      -webkit-font-smoothing: antialiased;
    }

    button {
      border: none;
      background: none;
      font: inherit;
    }

    .layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .body-wrap {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      background: var(--bg-body);
    }

    .page-shell {
      padding: 18px 20px 24px;
    }

    .page-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border-light);
    }

    .page-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-primary {
      color: #fff;
      background: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .table-wrap {
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      min-width: 1160px;
      border-collapse: collapse;
    }

    .data-table thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .data-table tbody td {
      padding: 14px 16px;
      font-size: 13px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-light);
      white-space: nowrap;
      vertical-align: middle;
    }

    .data-table tbody tr:hover {
      background: #FBFCFE;
    }

    .actions {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .action-link {
      font-size: 13px;
      cursor: pointer;
      color: #1890FF;
      transition: opacity var(--transition);
    }

    .action-link:hover {
      opacity: 0.72;
    }

    .action-link.delete {
      color: var(--danger);
    }

    .page-foot {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 16px;
      padding: 16px 18px;
    }

    .pagination-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .pagination-total {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .pagination {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .page-item,
    .page-arrow {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      font-size: 12px;
      font-weight: 600;
    }

    .page-item:hover,
    .page-arrow:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .page-item.active {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      min-width: 180px;
      max-width: 320px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      font-size: 12px;
      line-height: 1.6;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.28);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: all .25s ease;
      z-index: 260;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }

      .page-head {
        flex-direction: column;
        align-items: flex-start;
      }

    }
  
    /* ── 通用关联弹窗 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.4);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.is-open { display: flex; }
    .modal-dialog {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 48px rgba(15,23,42,.16);
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-close {
      width: 28px;
      height: 28px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: var(--border-light); color: var(--text-primary); }
    .modal-close:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .modal-body {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .modal-left {
      flex: 1;
      min-width: 0;
      padding: 16px 20px;
      overflow-y: auto;
      border-right: 1px solid var(--border-light);
    }
    .modal-filters {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .modal-filters .field-control { width: 180px; }
    .modal-filters .field-select { min-width: 160px; }
    .modal-table-wrap { overflow-x: auto; margin-bottom: 12px; }
    .modal-table-wrap .data-table { min-width: 400px; }
    .modal-table-wrap th:first-child,
    .modal-table-wrap td:first-child { width: 40px; text-align: center; }
    .modal-pagination {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .modal-pagination button {
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .modal-pagination button:hover { border-color: var(--primary); color: var(--primary); }
    .modal-pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .modal-right {
      width: 240px;
      flex-shrink: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-light);
    }
    .modal-right-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .modal-selected-list {
      flex: 1;
      min-height: 80px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .modal-selected-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 4px;
      margin-bottom: 4px;
      background: #F8FAFC;
    }
    .modal-selected-item .remove-btn {
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-hint);
      padding: 0 4px;
      font-size: 14px;
      line-height: 1;
    }
    .modal-selected-item .remove-btn:hover { color: var(--danger); }
    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border-light);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    /* ── v2.9 机房配置：空调表固定列 + 按物模型属性定义渲染的属性区 ── */
    .type-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .type-name { font-weight: 500; }
    .type-chain { font-size: 11px; color: var(--text-hint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .type-chain b { color: var(--text-secondary); font-weight: 500; }
    .sub-text { font-size: 11px; color: var(--text-hint); line-height: 1.5; }
    .ready-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .ready-ok    { background: var(--success-light); color: var(--success); }
    .ready-warn  { background: var(--warning-light); color: var(--warning); }
    .ready-error { background: var(--danger-light);  color: var(--danger); }
    .ready-off   { background: #F1F5F9; color: var(--text-hint); }
    .prop-toggle { font-size: 12px; color: var(--primary); cursor: pointer; white-space: nowrap; background: none; border: none; padding: 0; font-family: inherit; }
    .prop-toggle:hover { opacity: .85; }
    .prop-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 2px; }
    tr.prop-row td { background: #FAFCFF; padding: 0 12px 14px; }
    tr.prop-row.is-collapsed { display: none; }
    .data-table tbody tr.prop-row:hover { background: #FAFCFF; }
    .prop-panel { border: 1px dashed var(--border); border-radius: var(--radius); background: #fff; padding: 10px 12px; }
    .prop-panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
    .prop-panel-head code, .prop-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--primary); background: var(--primary-light); padding: 0 4px; border-radius: 3px; font-weight: 400; }
    .prop-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 14px; }
    .prop-item { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .prop-label { font-size: 12px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .prop-label .required { color: var(--danger); }
    .prop-value { display: flex; align-items: center; gap: 6px; }
    .prop-value .field-control, .prop-value .field-select { flex: 1; min-width: 0; padding: 5px 8px; font-size: 12px; background: #F8FAFC; color: var(--text-primary); }
    .prop-value .field-control[readonly] { cursor: default; }
    .prop-value .field-select:disabled { cursor: default; opacity: 1; color: var(--text-primary); -webkit-text-fill-color: var(--text-primary); }
    .prop-unit { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
    .prop-hint { font-size: 11px; color: var(--text-hint); line-height: 1.45; }
    .prop-item.is-missing .field-control, .prop-item.is-missing .field-select { border-color: var(--danger); background: var(--danger-light); color: var(--danger); -webkit-text-fill-color: var(--danger); }
    .prop-item.is-missing .prop-label { color: var(--danger); }
    .btn-maintain { font-size: 11px; padding: 3px 8px; border: 1px solid var(--danger); color: var(--danger); background: #fff; border-radius: 4px; cursor: pointer; white-space: nowrap; font-family: inherit; }
    .btn-maintain:hover { background: var(--danger-light); }
    .btn-maintain:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }
    .prop-derived { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-light); font-size: 12px; color: var(--text-secondary); display: flex; gap: 16px; flex-wrap: wrap; }
    .prop-derived b { color: var(--text-primary); font-weight: 600; }
    /* 模型就绪校验结果面板 */
    .check-summary { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
    .check-summary b { color: var(--text-primary); }
    .check-table td.lvl { font-weight: 600; white-space: nowrap; }
    .lvl-error { color: var(--danger); }
    .lvl-warn  { color: var(--warning); }
    .lvl-info  { color: var(--text-hint); }
    .lvl-pass  { color: var(--success); }
    .code-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #F1F5F9; color: var(--text-secondary); white-space: nowrap; }
    .code-tag.err  { background: var(--danger-light);  color: var(--danger); }
    .code-tag.warn { background: var(--warning-light); color: var(--warning); }
    .check-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--text-secondary); }
    .toast {
      position: fixed; right: 24px; bottom: 72px; min-width: 180px; max-width: 360px;
      padding: 12px 14px; border-radius: 10px; background: rgba(15, 23, 42, 0.92); color: #fff;
      font-size: 12px; line-height: 1.6; white-space: pre-line; box-shadow: 0 14px 34px rgba(15, 23, 42, 0.28);
      opacity: 0; transform: translateY(12px); pointer-events: none; transition: all .25s ease; z-index: 1200;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    /* 2026-10-31：属性页内直接编辑 + 批量复制 */
    .prop-value .field-control, .prop-value .field-select { background: #fff; }
    .prop-item.is-invalid .field-control, .prop-item.is-invalid .field-select { border-color: var(--danger); }
    .prop-item.is-invalid .prop-label { color: var(--danger); }
    .prop-item.is-edited:not(.is-missing):not(.is-invalid) .field-control,
    .prop-item.is-edited:not(.is-missing):not(.is-invalid) .field-select { border-color: var(--secondary); background: #F5F9FF; }
    .prop-err { display: none; font-size: 11px; color: var(--danger); line-height: 1.4; }
    .prop-item.is-invalid .prop-err { display: block; }
    .edit-tag { display: none; font-size: 10px; padding: 0 5px; border-radius: 3px; background: var(--primary-light); color: var(--primary); font-weight: 500; }
    .prop-item.is-edited .edit-tag { display: inline-block; }
    .edit-count { color: var(--primary); }
    .btn.btn-sm { padding: 3px 10px; font-size: 11px; }
    .copy-body { padding: 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .copy-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
    .copy-label { font-size: 13px; font-weight: 600; min-width: 72px; }
    .copy-sec { border: 1px solid var(--border-light); border-radius: var(--radius); overflow: hidden; }
    .copy-sec-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #F8FAFC; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--border-light); }
    .copy-sec-head label { font-weight: 400; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    .copy-props { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 16px; padding: 10px 12px; }
    .copy-check { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 1.5; cursor: pointer; }
    .copy-check input { margin-top: 3px; }
    .copy-check.is-disabled { color: var(--text-hint); cursor: not-allowed; }
    .copy-val { color: var(--text-secondary); }
    .copy-targets { display: flex; flex-direction: column; padding: 4px 12px; max-height: 220px; overflow-y: auto; }
    .copy-target { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 13px; border-bottom: 1px dashed var(--border-light); cursor: pointer; }
    .copy-target:last-child { border-bottom: none; }
    .copy-target .sub-text { margin-left: auto; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    @media (max-width: 1280px) { .prop-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

function removeDraftMembers(d,ids,removeTypes=[]){
 const set=new Set(ids);d.detachedDevices=d.detachedDevices||{};
 for(const item of d.devices||[])if(set.has(item.id))d.detachedDevices[item.id]=clone(item);
 if(!d.topology?.groups)return;
 const deleted=d.topology.groups.filter(g=>removeTypes.includes(g.type)).map(g=>g.id);
 d.topology.groups=d.topology.groups.filter(g=>!removeTypes.includes(g.type));
 const emptyGroups=[];for(const g of d.topology.groups){const old=g.members.length;g.members=g.members.filter(id=>!set.has(id));if(old&&!g.members.length)emptyGroups.push(g.id);}
 const invalid=new Set([...deleted,...emptyGroups]);
 if(Array.isArray(d.topology.relations))d.topology.relations=d.topology.relations.filter(r=>!invalid.has(r.from)).map(r=>({...r,to:(r.to||[]).filter(id=>!invalid.has(id))}));
}

function deviceCounts(s){return Store.deviceGroups(s).map(g=>g.name+' '+s.devices.filter(d=>d.group===g.key).length).join(' · ');}
const SHORT={'冷水主机':'冷机','风冷冷水机组':'风冷机组','板式换热器':'板换','冷冻水泵':'冷冻泵','冷却水泵':'冷却泵','二次泵':'二次泵','冷却塔':'冷却塔','蓄冷罐':'蓄冷罐','群控系统':'群控'};
function countsCell(s){const parts=Store.deviceGroups(s).map(g=>[SHORT[g.name]||g.name,s.devices.filter(d=>d.group===g.key).length]).filter(x=>x[1]);const total=parts.reduce((a,x)=>a+x[1],0);if(!total)return '<span class="muted">未关联设备</span>';return `<b>${total} 台</b><div class="sub-text one-line" title="${esc(deviceCounts(s))}">${parts.map(x=>x[0]+' '+x[1]).join(' · ')}</div>`;}
function spaceCell(path){const seg=String(path||'').split(' / ');const last=seg.pop();return `<div>${esc(last||'—')}</div>${seg.length?`<div class="sub-text">${esc(seg.join(' / '))}</div>`:''}`;}
function fmtTime(t){const d=new Date(t);if(isNaN(d))return '—';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function verifySummary(id){try{return JSON.parse(localStorage.getItem('coldStationVerifySummary:'+id)||'null');}catch{return null;}}
function verifyCell(r){const v=verifySummary(r.id),link=`${FILES.verify}?id=${r.id}`;if(!v)return `<a class="verify-pill pending" href="${link}">未校验</a>`;if((v.rev||0)<(r.rev||0))return `<a class="verify-pill pending" href="${link}" title="上次校验 ${esc(v.time)}">配置已修改 · 待重新校验</a>`;if(v.errors)return `<a class="verify-pill block" href="${link}" title="上次校验 ${esc(v.time)}">不能寻优 · ${v.errors} 条阻断</a>`;return `<a class="verify-pill pass" href="${link}" title="上次校验 ${esc(v.time)}">可以寻优${v.warns?' · '+v.warns+' 条提示':''}</a>`;}
function deleteSystem(id){const row=rows.find(r=>r.id===id),refs=id==='A'?['仿真模型「A路冷站仿真模型」','安全边界「A路冷站安全边界」','柔性寻优策略']:id==='B'?['仿真模型「B路风冷仿真模型」']:id==='C'?['能源拓扑「3#数据中心」']:[];if(refs.length){openModal('该冷水系统正在被引用，不能删除',anno('引用检查弹窗；入口：列表删除',['被仿真模型、安全边界、寻优策略或能源拓扑引用时不能删除。','列出引用方，点击可定位引用位置。','关闭弹窗保留当前配置。'],'4.1','ux')+`<p>${row.name}</p><div class="reference-list">${refs.map(r=>`<button class="reference-item" onclick="toast('定位${r}')">${r}<span>定位 →</span></button>`).join('')}</div>`,null);return;}openModal('删除冷站配置？',anno('删除确认弹窗；入口：未引用系统的删除',['删除冷水系统、下级分组和供水关系。','设备实例与设备属性保留。','确认后列表移除该行；取消不改变配置。'],'4.1','ux')+`<p>确认删除「${row.name}」？</p><div class="note-block danger-note">删除冷水系统、下级分组和供水关系，设备和设备属性保留。</div>`,()=>{Store.removeConfig(id);closeModal();renderList();toast('已删除冷站配置，设备和设备属性保留');},'确认删除');}
function conflictBody(){return anno('投入 / 投出确认弹窗；入口：列表顶部“去确认”',['每台设备先显示所属冷水系统，再列出属性、柔性、全局、长周期寻优中的现有值。','确认值须从本行现有值中选择，缺省不选择。','点击本行确认后统一各处的值，剩余行继续保留。'],'7.5','field')+`<div class="table-wrap"><table class="data-table conflict-table"><thead><tr><th>冷水系统</th><th>设备</th><th>设备属性中的值</th><th>柔性寻优中的值</th><th>全局寻优中的值</th><th>长周期寻优中的值</th><th>确认值</th><th>操作</th></tr></thead><tbody>${conflicts.map((c,i)=>`<tr><td>${esc(Store.getEffective(c.configId||'A')?.name||'冷水系统已移除')}</td><td>${c.name}</td>${c.values.map(v=>`<td>${v}</td>`).join('')}<td><div class="radio-group">${[...new Set(c.values)].map(v=>`<label><input type="radio" name="resolve${i}" value="${v}">${v}</label>`).join('')}</div></td><td><button class="btn btn-primary" onclick="resolveConflict(${i})">确认此行</button></td></tr>`).join('')}</tbody></table></div>`;}
function resolveConflict(i){const selected=$(`input[name="resolve${i}"]:checked`);if(!selected){toast('请先选择本行的确认值');return;}const c=conflicts[i],v=selected.value,devId=({'3#冷水主机':'CH3','5#冷却塔':'CT5','2#二次泵':'SWP2'})[c.name];Store.setInService('A',devId,v==='投入'?'0':'1','不一致清单');conflicts.splice(i,1);renderList();if(conflicts.length){$('#modalContent').innerHTML=conflictBody();}else closeModal();toast(`${c.name}已统一为${v}，已同步到冷站配置和三个寻优策略`);}
$('#openConflicts').onclick=()=>openModal('确认投入 / 投出不一致',conflictBody(),null,'确认',true);
$('#search').oninput=renderList;$('#filterType').onchange=renderList;
$('#resetDemo').onclick=()=>{rows=Store.listConfigs();conflicts=[{name:'3#冷水主机',values:['投出','投入','投出','投出']},{name:'5#冷却塔',values:['投入','投出','投入','投入']},{name:'2#二次泵',values:['投入','投入','投出','投出']}];$('#search').value='';$('#filterType').value='';renderList();toast('已重置演示数据');};
renderList();if(params.get('saved')==='1')toast('已保存，建议执行配置校验',FILES.verify+'?id='+(params.get('id')||loadDraft()?.id||configId));

</script></body></html>
