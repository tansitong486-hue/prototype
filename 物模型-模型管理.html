<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模型管理</title>
  <style>
    :root {
      --primary: #1E40AF;
      --primary-dark: #17358A;
      --primary-tint: #EEF4FF;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-hint: #94A3B8;
      --border: #D8E1EB;
      --border-light: #EAF0F6;
      --bg-body: #F6F8FB;
      --bg-card: #FFFFFF;
      --danger: #DC2626;
      --danger-border: #FCA5A5;
      --success: #059669;
      --warning: #D97706;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.04);
      --transition: .22s cubic-bezier(.4, 0, .2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-body);
      -webkit-font-smoothing: antialiased;
    }

    button { border: none; background: none; font: inherit; cursor: pointer; }

    [hidden] { display: none !important; }

    .layout { display: flex; flex-direction: column; min-height: 100vh; }
    .body-wrap { display: flex; flex: 1; min-height: 0; }
    .main { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg-body); }

    .page-shell { padding: 18px 20px 24px; }

    .page-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px 12px;
      flex-wrap: wrap;
    }

    .page-title { font-size: 18px; font-weight: 700; }

    .page-head-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 14px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .btn-primary { color: #fff; background: var(--primary); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline { color: var(--primary); background: #fff; border: 1px solid var(--primary); }
    .btn-outline:hover { background: var(--primary-tint); }
    .btn-ghost { color: var(--text-primary); background: #fff; border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

    .toolbar-search {
      width: 240px;
      max-width: 42vw;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
    }
    .toolbar-search:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.12);
    }

    /* 左树 + 右卡片 */
    .model-split {
      display: flex;
      min-height: 620px;
      border-top: 1px solid var(--border-light);
    }

    .model-tree {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--border-light);
      background: #FAFBFD;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .model-tree-head {
      padding: 12px 14px 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .model-tree-search { padding: 0 14px 12px; border-bottom: 1px solid var(--border-light); }

    .model-tree-search input {
      width: 100%;
      height: 32px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      outline: none;
    }
    .model-tree-search input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(30, 64, 175, 0.12);
    }

    .model-tree-scroll { flex: 1; overflow-y: auto; padding: 10px 8px 14px; max-height: 660px; }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: background var(--transition), color var(--transition);
    }
    .tree-row:hover { background: rgba(30, 64, 175, 0.06); color: var(--text-primary); }
    .tree-row.active { background: var(--primary-tint); color: var(--primary); font-weight: 600; }
    .tree-chevron { width: 12px; font-size: 9px; color: var(--text-hint); flex-shrink: 0; }
    .tree-chevron.placeholder { visibility: hidden; }
    .tree-children { padding-left: 16px; }

    .model-body { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px 18px 20px; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .status-bar-label { font-size: 13px; color: var(--text-secondary); }
    .status-pill {
      height: 28px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .status-pill.active { border-color: #86EFAC; background: #F0FDF4; color: #15803D; font-weight: 600; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .model-card {
      display: flex;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    }
    .model-card:hover {
      border-color: #B9CCF5;
      box-shadow: var(--shadow-card);
      transform: translateY(-1px);
    }

    .model-card-ico {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, #3B82F6, #1E40AF);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .model-card-ico svg { width: 20px; height: 20px; }

    .model-card-main { flex: 1; min-width: 0; }

    .model-card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }
    .model-card-title { font-size: 14px; font-weight: 600; }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
    }
    .tag-pub { color: #15803D; background: #F0FDF4; border: 1px solid #86EFAC; }
    .tag-draft { color: var(--warning); background: #FFFBEB; border: 1px solid #FCD34D; }

    .model-card-id {
      font-size: 12px;
      color: var(--text-hint);
      word-break: break-all;
      margin-bottom: 6px;
    }
    .model-card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-block {
      padding: 60px 0;
      text-align: center;
      color: var(--text-hint);
      font-size: 13px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: #FAFBFD;
    }

    .pager-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 14px 2px 0;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .pager-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    @media (max-width: 1080px) {
      .model-split { flex-direction: column; }
      .model-tree { width: 100%; border-right: 0; border-bottom: 1px solid var(--border-light); }
      .model-tree-scroll { max-height: 240px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div id="app-header"></div>
    <div class="body-wrap">
      <div id="app-sidebar"></div>
      <main class="main">
        <div class="page-shell">
          <section class="page-card" aria-label="模型管理">
            <div class="page-head">
              <h1 class="page-title">模型管理</h1>
              <div class="page-head-actions">
                <input type="search" class="toolbar-search" id="searchInput" placeholder="模型名称、ID" aria-label="搜索模型">
                <button type="button" class="btn btn-outline">导入模型</button>
                <button type="button" class="btn btn-outline">导出模型</button>
                <button type="button" class="btn btn-outline">批量发布</button>
                <button type="button" class="btn btn-primary">新建模型</button>
              </div>
            </div>

            <div class="model-split">
              <aside class="model-tree" aria-label="继承链">
                <div class="model-tree-head">继承链</div>
                <div class="model-tree-search">
                  <input type="search" id="treeSearch" placeholder="请输入关键字" aria-label="搜索继承链">
                </div>
                <div class="model-tree-scroll" id="treeRoot"></div>
              </aside>

              <div class="model-body">
                <div class="status-bar">
                  <span class="status-bar-label">模型状态</span>
                  <button type="button" class="status-pill active" data-status="published">已发布 (592)</button>
                  <button type="button" class="status-pill" data-status="draft">待发布 (0)</button>
                </div>

                <div class="card-grid" id="cardGrid"></div>
                <div class="empty-block" id="emptyBlock" hidden>没有找到匹配的模型</div>

                <div class="pager-bar">
                  <span id="pagerTotal">共 0 条</span>
                  <span>20条/页</span>
                  <span class="pager-num">1</span>
                  <span>前往 1 页</span>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* 演示数据：模型清单（对齐现网形态，不含任何指标信息） */
      var MODELS = [
        { name: '角色', id: 'core:Agent', chain: 'agent', desc: '角色' },
        { name: '资产', id: 'core:Asset', chain: 'asset', desc: '资产（设备与表具本体等资产类继承链根）' },
        { name: '测点类型', id: 'core:Capability', chain: 'capability', desc: '模型测点的引用模型' },
        { name: '目录', id: 'dtdl:Catalog', chain: 'catalog', desc: '目录' },
        { name: '集合', id: 'core:Collection', chain: 'collection', desc: '集合（数据中心单元、系统、设备组等集合类继承链根）' },
        { name: '数据中心单元', id: 'dtdl:collection:DCUnit', chain: 'collection', desc: '数据中心单元' },
        { name: '暖通空调系统', id: 'dtdl:collection:HVACSystem', chain: 'collection', desc: '暖通空调系统' },
        { name: '电力系统', id: 'dtdl:collection:ElectricalSystem', chain: 'collection', desc: '电力系统（现场实例常命名为配电系统）' },
        { name: '其他系统', id: 'dtdl:collection:OtherSystem', chain: 'collection', desc: '其他系统' },
        { name: 'IT 系统', id: 'dtdl:collection:ITSystem', chain: 'collection', desc: 'IT 系统（能效指标的分母来源）' },
        { name: '制冷单元', id: 'dtdl:ChillerUnit', chain: 'collection', desc: '暂无描述' },
        { name: '冷冻水泵设备组', id: 'dtdl:ChilledWaterPumpUnit', chain: 'collection', desc: '冷冻水泵设备组' },
        { name: '冷却泵设备组', id: 'dtdl:CoolPumpUnitGroup', chain: 'collection', desc: '暂无描述' },
        { name: '冷却塔设备组', id: 'dtdl:CoolTowerGroup', chain: 'collection', desc: '冷却塔设备组' },
        { name: '并联冷却泵管路', id: 'dtdl:CoolPumpPipeline', chain: 'collection', desc: '暂无描述' },
        { name: '并联冷却塔管路', id: 'dtdl:CoolTowerPipeline', chain: 'collection', desc: '暂无描述' },
        { name: '采集对象', id: 'iphd:Collector', chain: 'collector', desc: '采集对象' },
        { name: '命令', id: 'core:Command', chain: 'command', desc: '可以作为命令的模型' },
        { name: '组件', id: 'core:Component', chain: 'component', desc: '可以作为组件的模型' },
        { name: '空间', id: 'core:Space', chain: 'space', desc: '空间（园区 / 楼栋 / 楼层 / 房间等空间类继承链根）' },
        { name: '园区', id: 'space:Land', chain: 'space', desc: '园区（IT 侧分母的解析起点）' },
        { name: '楼栋', id: 'space:Building', chain: 'space', desc: '楼栋' },
        { name: '楼层', id: 'space:Floor', chain: 'space', desc: '楼层' },
        { name: '房间', id: 'space:Room', chain: 'space', desc: '房间 / 机房' },
        { name: '交流电表', id: 'dtdl:device:ACMeter', chain: 'asset', desc: '交流电表（电能源类型的计量表具）' },
        { name: '水表', id: 'dtdl:device:WaterMeter', chain: 'asset', desc: '水表（水能源类型的计量表具）' },
        { name: '冷量表', id: 'dtdl:device:CoolingMeter', chain: 'asset', desc: '冷量表' },
        { name: '物理设备', id: 'core:PhysicalDevice', chain: 'physical', desc: '物理设备' },
        { name: '展示', id: 'core:Display', chain: 'display', desc: '展示' },
        { name: '文档', id: 'core:Document', chain: 'document', desc: '文档' },
        { name: '条目', id: 'core:Entry', chain: 'entry', desc: '条目' },
        { name: '状态机', id: 'core:StateMachine', chain: 'statemachine', desc: '状态机' },
        { name: '关系', id: 'core:Relation', chain: 'relation', desc: '关系' },
        { name: '属性', id: 'core:Property', chain: 'property', desc: '属性' },
        { name: '场景', id: 'core:Scene', chain: 'scene', desc: '场景' },
        { name: '履历', id: 'core:History', chain: 'history', desc: '履历' }
      ];

      var TREE = [
        { key: 'all', label: '全部' },
        { key: 'agent', label: '角色' },
        { key: 'asset', label: '资产', children: ['交流电表', '水表', '冷量表'] },
        { key: 'capability', label: '测点类型' },
        { key: 'catalog', label: '目录' },
        { key: 'collection', label: '集合', children: ['数据中心单元', '暖通空调系统', '电力系统', '其他系统', 'IT 系统', '制冷单元'] },
        { key: 'collector', label: '采集对象' },
        { key: 'command', label: '命令' },
        { key: 'display', label: '展示' },
        { key: 'document', label: '文档' },
        { key: 'entry', label: '条目' },
        { key: 'statemachine', label: '状态机' },
        { key: 'history', label: '履历' },
        { key: 'property', label: '属性' },
        { key: 'relation', label: '关系' },
        { key: 'scene', label: '场景' },
        { key: 'space', label: '空间', children: ['园区', '楼栋', '楼层', '房间'] },
        { key: 'physical', label: '物理设备' }
      ];

      var ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';

      var state = { chain: 'all', keyword: '', status: 'published' };

      var grid = document.getElementById('cardGrid');
      var emptyBlock = document.getElementById('emptyBlock');
      var pagerTotal = document.getElementById('pagerTotal');
      var treeRoot = document.getElementById('treeRoot');

      function renderTree() {
        var kw = document.getElementById('treeSearch').value.trim();
        var html = '';
        TREE.forEach(function (node) {
          if (kw && node.label.indexOf(kw) < 0 && !(node.children || []).some(function (c) { return c.indexOf(kw) >= 0; })) return;
          var active = state.chain === node.key ? ' active' : '';
          html += '<div class="tree-row' + active + '" data-chain="' + node.key + '">'
            + '<span class="tree-chevron' + (node.children ? '' : ' placeholder') + '">' + (node.children ? '▾' : '▸') + '</span>'
            + '<span>' + node.label + '</span></div>';
          if (node.children) {
            html += '<div class="tree-children">';
            node.children.forEach(function (child) {
              html += '<div class="tree-row" data-model-name="' + child + '"><span class="tree-chevron placeholder">▸</span><span>' + child + '</span></div>';
            });
            html += '</div>';
          }
        });
        treeRoot.innerHTML = html || '<div class="empty-block" style="padding:24px 0">无匹配继承链</div>';
      }

      function detailHref(model) {
        return '物模型-模型详情.html?model=' + encodeURIComponent(model.id);
      }

      function renderCards() {
        var kw = state.keyword.toLowerCase();
        var list = MODELS.filter(function (m) {
          if (state.status === 'draft') return false;
          if (state.chain !== 'all' && m.chain !== state.chain) return false;
          if (kw && m.name.toLowerCase().indexOf(kw) < 0 && m.id.toLowerCase().indexOf(kw) < 0) return false;
          return true;
        });

        grid.innerHTML = list.map(function (m) {
          return '<a class="model-card" href="' + detailHref(m) + '">'
            + '<span class="model-card-ico">' + ICON + '</span>'
            + '<span class="model-card-main">'
            + '<span class="model-card-title-row"><span class="model-card-title">' + m.name + '</span>'
            + '<span class="tag tag-pub">已发布</span></span>'
            + '<span class="model-card-id">' + m.id + '</span>'
            + '<span class="model-card-desc">' + m.desc + '</span>'
            + '</span></a>';
        }).join('');

        emptyBlock.hidden = list.length > 0;
        pagerTotal.textContent = '共 ' + list.length + ' 条';
      }

      treeRoot.addEventListener('click', function (e) {
        var row = e.target.closest('.tree-row');
        if (!row) return;
        var name = row.getAttribute('data-model-name');
        if (name) {
          var hit = MODELS.filter(function (m) { return m.name === name; })[0];
          if (hit) window.location.href = detailHref(hit);
          return;
        }
        state.chain = row.getAttribute('data-chain') || 'all';
        renderTree();
        renderCards();
      });

      document.getElementById('treeSearch').addEventListener('input', renderTree);

      document.getElementById('searchInput').addEventListener('input', function () {
        state.keyword = this.value.trim();
        renderCards();
      });

      document.querySelectorAll('.status-pill').forEach(function (pill) {
        pill.addEventListener('click', function () {
          document.querySelectorAll('.status-pill').forEach(function (p) { p.classList.remove('active'); });
          pill.classList.add('active');
          state.status = pill.getAttribute('data-status');
          renderCards();
        });
      });

      renderTree();
      renderCards();
    })();
  </script>
  <script src="components/nav.js" data-active-nav="工程配置" data-active-sidebar="模型管理"></script>
</body>
</html>
